# concepts/agentic-value-stream.concept.yaml ;; Agentic Value Stream ;; ES:CONCEPT:agentic-value-stream
#
# Per CR-ES-005 §4 + §5 + ADR-ES-005 §2 + §4:
#   An Agentic Value Stream is a Value Stream in which one or more
#   stages are materially realized through agentic behavior, enabling
#   delegated interpretation, action selection, coordination,
#   adaptation, or execution toward stakeholder value realization.
#
# Per CR-AVS-001 (Repository Conformance Reconciliation, 2026-09-30):
#   - This record reconciles lifecycle state across concept.yaml,
#     kit/kit.yaml, docs/conformance.md, and README.md.
#   - Lifecycle status: Candidate (semantic qualification Wave 2 will
#     promote to Established on landing CR-VAS-046 acceptance).
#   - Conformance status: structurally_conformant (10 test files present
#     in kit/, counts auto-derived in kit/kit.yaml and docs/conformance.md).
#   - Concept repository: Enterprise-Semantics/agentic-value-stream
#     (renamed from concept-agentic-value-stream per ES-ADR-051, 2026-09-30).
#
# Specialisation of Value Stream (not replacement, not parallel
# construct). Per CR-ES-005 §8, the Agentic Value Stream schema
# preserves the mandatory Value Stream semantics.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)

id: ES:CONCEPT:agentic-value-stream
canonical_name: Agentic Value Stream
definition: |
  A Value Stream in which one or more stages are materially realized
  through agentic behavior, enabling delegated interpretation, action
  selection, coordination, adaptation, or execution toward stakeholder
  value realization. Per CR-ES-005 §4 + ADR-ES-005 §2.

