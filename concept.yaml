      status: candidate
      note: Pre-reconciliation state per CR-ES-005.
    - version: 0.5.0
      date: 2026-09-30
      status: candidate
      note: Reconciliation per CR-AVS-001. Semantic qualification in CR-VAS-002 (Wave 2) will promote to Established.

