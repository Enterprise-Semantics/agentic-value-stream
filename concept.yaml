# Concept repository reference (renamed per ES-ADR-051).
concept_repo: Enterprise-Semantics/agentic-value-stream

# === Semantic qualification (CR-VAS-002) ===

qualification:
  # Specializes the base concept.
  specializes: [ES:CONCEPT:value-stream]

  # The seven values that constitute material agentic qualification.
  # A candidate AVS MUST satisfy all seven to qualify.
  required_values:
    - id: AVS-VAL-01
      label: Value-Stream Foundation
      assertion: |
        The candidate MUST be a Value Stream. The Value-Stream
        Foundation is prerequisite, not optional. A sequence of
        agentic actions that does not constitute a Value Stream is
        not an Agentic Value Stream.
    - id: AVS-VAL-02
      label: Material Agentic Participation
      assertion: |
        One or more stages MUST be materially realized through
        agentic behavior. Materiality is determined by the
        materiality criteria below (AVS-MAT-01..03).
    - id: AVS-VAL-03
      label: Delegated or Entrusted Intent
      assertion: |
        The agentic participants MUST be entrusted with an intended
        outcome or progression objective. Delegation is from a
        stakeholder to the agentic actor and carries the intent.
    - id: AVS-VAL-04
      label: Bounded Authority
      assertion: |
        The agentic participants MUST operate within bounded
        authority. Bounded authority is explicit and communicated
        to the participants; it delimits the action space.
    - id: AVS-VAL-05
      label: Contextual Interpretation
      assertion: |
        The agentic participants MUST interpret relevant context
        (signals, states, prior history, stakeholder inputs) in
        service of the entrusted intent. Interpretation is not the
        same as reaction to a fixed stimulus.
    - id: AVS-VAL-06
      label: Permissible Action or Progression Selection
      assertion: |
        The agentic participants MUST select permissible actions or
        progression paths. Selection presupposes an action space
        and an evaluation criterion; it is incompatible with a
        completely predetermined sequence.
    - id: AVS-VAL-07
      label: Value-Realization Effect
      assertion: |
        The agentic participation MUST contribute to stakeholder
        value realization. Effect is observable in the realized
        Value Stream outcome.

  # The seven things that are explicitly NOT required. Their absence
  # does not disqualify; their presence alone does not qualify.
  not_required:
    - id: AVS-NRQ-01
      label: AI
      assertion: |
        AI is not a prerequisite for Agentic Value Stream.
        An AVS may be realised with non-AI agentic participants
        (human teams with delegated authority, rule-based
        interpreters with bounded scope, etc.).
    - id: AVS-NRQ-02
      label: Autonomy
      assertion: |
        Autonomy is not a prerequisite. An AVS may include
        supervised, reviewed, or constrained agentic
        participation. AVS is distinct from Autonomous Value
        Stream (ES:CONCEPT:autonomous-value-stream) precisely
        because autonomy is not required.
    - id: AVS-NRQ-03
      label: Automation
      assertion: |
        Automation is not a prerequisite. An AVS may include
        manual or discretionary participation at non-agentic
        stages. The qualification is satisfied by material agentic
        participation in some portion, not by full automation.
    - id: AVS-NRQ-04
      label: Decision-making as isolated quality
      assertion: |
        Decision-making alone is not the qualification. The
        qualification is delegated intent + bounded authority +
        contextual interpretation + action selection. Decision-
        making is necessary but not sufficient.
    - id: AVS-NRQ-05
      label: Agency as isolated quality
      assertion: |
        Agency (the general capacity to act) is not the
        qualification. The qualification is the intersection of
        agency with delegated intent, bounded authority, and value-
        stream foundation.
    - id: AVS-NRQ-06
      label: Learning
      assertion: |
        Learning (model adaptation, feedback-driven update) is
        not a prerequisite. An AVS may be realised by participants
        whose behavior is fixed across instances.
    - id: AVS-NRQ-07
      label: Human intervention is illegitimate
      assertion: |
        Human intervention remains legitimate at any stage.
        Human-in-the-loop, human-on-the-loop, and human-after-
        the-loop are all compatible with AVS qualification, so
        long as the agentic participation carries the entrusted
        intent.

  # The seven exclusion conditions. Each is a positive disqualifier.
  exclusion_conditions:
    - id: AVS-EXC-01
      label: Deterministic automation only
      assertion: |
        If all stages execute a completely predetermined sequence
        with no contextual interpretation, the candidate fails
        qualification. Deterministic automation is a different
        construct.
    - id: AVS-EXC-02
      label: Adaptive automation only
      assertion: |
        If all stages exhibit stimulus-response adaptation without
        delegated intent, the candidate fails qualification.
        Adaptive automation is a different construct.
    - id: AVS-EXC-03
      label: Decision-support AI only
      assertion: |
        If the AI system produces recommendations that are then
        executed by a separate actor without progression
        authority, the candidate fails qualification. Decision
        support is a different construct.
    - id: AVS-EXC-04
      label: Human discretion only
      assertion: |
        If the entire stream is executed by humans with full
        discretion at every stage (no delegated intent to a
        non-human agentic participant), the candidate fails
        qualification. The qualification requires some material
        agentic participation.
    - id: AVS-EXC-05
      label: Autonomous system participation only
      assertion: |
        If the participation qualifies as Autonomous Value Stream
        (ES:CONCEPT:autonomous-value-stream) by virtue of self-
        directed progression without external authority binding,
        the candidate does not qualify as AVS. The two are
        complementary, not overlapping.
    - id: AVS-EXC-06
      label: Dynamic workflow participation only
      assertion: |
        If the participation is realised as a dynamic workflow
        (ES:CONCEPT:agentic-workflow) without value-stream
        anchoring, the candidate fails qualification. The
        qualification is value-stream anchored.
    - id: AVS-EXC-07
      label: Insufficient material proportion
      assertion: |
        If the agentic participation is below the materiality
        threshold (AVS-MAT-01..03), the candidate fails
        qualification. Materiality is a quantitative qualifier.

  # Materiality requirements. The threshold for what counts as
  # "material" agentic participation.
  materiality:
    - id: AVS-MAT-01
      label: Stage-count materiality
      threshold: |
        Material proportion is at least one (1) Value Stage whose
        realisation is materially agentic. A Value Stage is
        materially agentic when its entrusted intent + bounded
        authority + interpretation + action selection are present.
    - id: AVS-MAT-02
      label: Value-effect materiality
      threshold: |
        The agentic participation must produce a stakeholder-
        observable value effect. Trivial or symbolic agentic
        participation does not qualify.
    - id: AVS-MAT-03
      label: Continuity materiality
      threshold: |
        The agentic participation must persist across the stage
        realisation, not as a single decision in an otherwise
        fixed sequence.

  # Normative qualification test. A candidate PASSES iff:
  #   (a) all seven required_values (AVS-VAL-01..07) hold, AND
  #   (b) none of the seven exclusion_conditions (AVS-EXC-01..07) hold, AND
  #   (c) materiality (AVS-MAT-01..03) is satisfied.
  normative_qualification_test:
    preconditions:
      - candidate is a Value Stream
    pass_criteria:
      - forall(AVS-VAL-01..07) candidate satisfies
      - forall(AVS-EXC-01..07) candidate does not satisfy
      - materiality(AVS-MAT-01..03) holds
    fail_criteria:
      - any AVS-VAL not satisfied
      - any AVS-EXC satisfied
      - materiality not satisfied

  # Architectural invariants enforced by the conformance kit.
  invariants:
    - id: AVS-INV-001
      name: Value-Stream Anchor Invariant
      assertion: |
        Every Agentic Value Stream MUST be anchored to a Value
        Stream (ES:CONCEPT:value-stream). AVS is a
        specialisation, not a parallel construct.
    - id: AVS-INV-002
      name: Stage Composition Invariant
      assertion: |
        An Agentic Value Stream MUST contain one or more Value
        Stages (ES:CONCEPT:value-stage). The stage construct is
        preserved per CR-VAS-002 §11.
    - id: AVS-INV-003
      name: Material Agentic Participation Invariant
      assertion: |
        An Agentic Value Stream MUST contain at least one Value
        Stage whose realisation is materially agentic.
    - id: AVS-INV-004
      name: Delegated Intent Invariant
      assertion: |
        For each materially agentic Value Stage, there MUST be
        an entrusted intent declared by a stakeholder.
    - id: AVS-INV-005
      name: Bounded Authority Invariant
      assertion: |
        For each materially agentic Value Stage, there MUST be
        an explicit bounded authority declared and communicated.
    - id: AVS-INV-006
      name: Contextual Interpretation Invariant
      assertion: |
        For each materially agentic Value Stage, the agentic
        participant MUST interpret relevant context (signals,
        states, history) in service of the entrusted intent.
    - id: AVS-INV-007
      name: Action Selection Invariant
      assertion: |
        For each materially agentic Value Stage, the agentic
        participant MUST select from a set of permissible
        actions or progression paths.
    - id: AVS-INV-008
      name: Value-Realisation Invariant
      assertion: |
        The agentic participation MUST contribute to stakeholder
        value realisation. Effect is observable in the realised
        Value Stream outcome.
    - id: AVS-INV-009
      name: AI-Not-Required Invariant
      assertion: |
        The qualification does NOT require AI. A non-AI
        agentic participant may satisfy all conditions.
    - id: AVS-INV-010
      name: Autonomy-Not-Required Invariant
      assertion: |
        The qualification does NOT require autonomy. AVS and
        Autonomous Value Stream are complementary, not
        overlapping.
    - id: AVS-INV-011
      name: Automation-Not-Required Invariant
      assertion: |
        The qualification does NOT require automation. Manual
        or discretionary participation at non-agentic stages is
        compatible.
    - id: AVS-INV-012
      name: Determinism-Exclusion Invariant
      assertion: |
        If every stage is a completely predetermined sequence,
        the candidate is NOT an AVS. Deterministic automation
        is a different construct.
    - id: AVS-INV-013
      name: Boundary-Assertion Invariant
      assertion: |
        The candidate MUST NOT collapse into Agentic Value
        Stage (not introduced), Agentic Workflow, Agentic
        Operations, or Autonomous Value Stream.

  # Edge cases recognised by the conformance kit.
  edge_cases:
    - id: AVS-EDGE-01
      label: Single-stage material agentic participation
    - id: AVS-EDGE-02
      label: Cross-stage material agentic participation
    - id: AVS-EDGE-03
      label: Multiple agentic participants with separate authorities
    - id: AVS-EDGE-04
      label: Agentic participation with co-existing automation
    - id: AVS-EDGE-05
      label: Agentic participation with co-existing human discretion

  # Boundary assertions covered.
  boundary_assertions:
    - per_es_adr_005
    - per_es_adr_031_5_category_taxonomy
    - per_cr_vas_002_qualification

  # Cardinal author rule preserved.
  author: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)
  governance: enterprise-semantics

  provenance:
    decision: [ES-ADR-005, ES-ADR-031, ES-ADR-049, ES-ADR-051, ES-ADR-052]
    implementation: [CR-ES-005, CR-AVS-001, CR-VAS-002]
    reconciliation: CR-AVS-001
    qualification: CR-VAS-002


# === Agentic Participation & Value Stream Realization Model (CR-VAS-003) ===

participation:
  # Specialises the qualification semantics established by CR-VAS-002.
  # CR-VAS-003 introduces the Agentic Participation relationship as a
  # subordinate structural layer within the canonical Value Stream.
  specializes: ES:CONCEPT:agentic-value-stream

  # CR-VAS-003 §3 - Normative Design Principle.
  # Agentic Participation is SUBORDINATE to the Value Stream. The
  # hierarchy is Value Stream -> Value Stage -> Agentic Participation ->
  # Actor/Agent + Entrusted Intent + Bounded Authority + Context +
  # Decision/Selection + Action/Progression + Outcome Contribution.
  hierarchy:
    - id: VS-LAYER
      label: Value Stream
      note: Canonical primary construct.
    - id: STAGE-LAYER
      label: Value Stage / Value-Realization Area
      note: Canonical stage construct; preserved per CR-VAS-002 AVS-INV-002.
    - id: AP-LAYER
      label: Agentic Participation
      subordinate_to: STAGE-LAYER
      note: Subordinate relationship, not parallel stage.
    - id: AP-COMPONENT
      label: Agentic Participation Components
      contains:
        - Actor / Agent
        - Entrusted Intent
        - Bounded Authority
        - Context
        - Decision / Selection
        - Action / Progression
        - Outcome Contribution

  # CR-VAS-003 §4.2 - Agentic Participation as the semantic bridge.
  # The Agent is NOT the definition of agenticity. Agentic Participation is.
  principle: |
    Agentic Participation represents the fact that an actor participates
    in the realization of a material portion of a Value Stream through
    agentic behavior. It is the semantic bridge between the Value
    Stream and the actor performing agentic realization.

  # CR-VAS-003 §5 - Participation as a relationship, not a new Value-Stage
  # type. Agentic Value Stage, Agentic Process, Agentic Workflow, Agentic
  # Operation, Agentic Activity are FORBIDDEN as parallel semantic
  # constructs solely to represent agenticity.
  prohibited_constructs:
    - Agentic Value Stage
    - Agentic Process
    - Agentic Workflow
    - Agentic Operation
    - Agentic Activity
  permitted_stage_constructs:
    - human realization
    - automated realization
    - agentic realization
    - hybrid realization
    - multiple forms of realization

  # CR-VAS-003 §6 - Participation Scope controlled vocabulary.
  # end_to_end is explicitly NOT the default representation. A Value
  # Stream can qualify as Agentic because of a single material agentic
  # participation point.
  scope:
    allowed:
      - id: decision
        meaning: Agentic behavior materially affects a consequential decision.
      - id: execution
        meaning: Agentic behavior selects or performs a material action.
      - id: coordination
        meaning: Agentic behavior materially coordinates progression among participants or value-realization elements.
      - id: stage
        meaning: Agentic participation materially affects a Value Stage.
      - id: cross_stage
        meaning: Agentic participation materially affects progression across multiple Value Stages.
      - id: end_to_end
        meaning: Agentic participation materially governs or contributes across substantially the entire Value Stream.
    default: stage
    end_to_end_is_default: false
    rationale: |
      A Value Stream can qualify as Agentic because of a single material
      agentic participation point. End-to-end agenticity is not the
      default representation.

  # CR-VAS-003 §7 - Entrusted Intent (Instruction != Intent).
  intent:
    required: true
    distinction:
      instruction: A predetermined directive (e.g. "Execute step 4 after step 3").
      intent: A desired outcome or progression objective (e.g. "Resolve the customer's issue within policy and service-level constraints.").
    principle: |
      Agentic Participation requires an entrusted or delegated purpose,
      not merely an executable instruction.

  # CR-VAS-003 §8 - Authority Model.
  authority:
    required: true
    structure:
      scope: The action space.
      permissions: Granted permissions.
      constraints: Binding constraints.
      policies: Policy rules.
      thresholds: Operational/financial/risk thresholds.
      escalation_conditions: When human review is required.
      revocation_conditions: When authority is revoked.
    bounded_by:
      - role
      - policy
      - financial_threshold
      - operational_threshold
      - risk_threshold
      - regulatory_constraint
      - security_constraint
      - data_access_constraint
      - escalation_rule
      - human_approval_requirement
      - temporal_constraint
      - geographic_constraint
    principle: |
      Intent establishes what is being pursued; authority establishes
      what may legitimately be done in pursuit of it. Neither is
      sufficient independently.

  # CR-VAS-003 §9 - Context Interpretation.
  context:
    required: true
    allowed_kinds:
      - current_state
      - customer_state
      - transaction_state
      - environmental_conditions
      - policy_state
      - resource_availability
      - historical_information
      - signals_and_events
      - external_conditions
      - other_value_stream_state
    technology_agnostic: true

  # CR-VAS-003 §10 - Decision and Action Semantics.
  # These shall NOT be treated as interchangeable. The critical
  # transition is Selection among permissible alternatives in pursuit
  # of an entrusted outcome.
  decision_action_chain:
    - instruction
    - evaluation
    - recommendation
    - selection
    - commitment
    - execution
  principle: |
    A system that only evaluates a fixed rule set without meaningful
    selection does not become agentic merely because the evaluation
    is sophisticated.

  # CR-VAS-003 §11 - Permissible Action Space.
  action_space:
    required: true
    structure:
      intent: Intent of the participant.
      context: Interpreted context.
      authority: Bounded authority.
    result: Permissible Action Space.
    principle: |
      The model must establish that more than one permissible
      response/path exists AND that the realized response is selected
      contextually rather than completely predetermined.

  # CR-VAS-003 §12 - Outcome Contribution.
  outcome:
    required: true
    chain:
      - action_selected
      - value_stream_progression
      - stakeholder_value_outcome
    principle: |
      The existence of an agentic decision without material value-stream
      consequence shall NOT automatically qualify the Value Stream as
      Agentic. This reinforces the materiality requirement from
      CR-VAS-002 (AVS-MAT-01..03).

  # CR-VAS-003 §13 - Human Participation as a valid realization pattern.
  human_participation_patterns:
    - id: AP-HUMAN-01
      label: Pattern A - Human delegates to Agent
      shape:
        - Human
        - "delegates intent"
        - Agent
        - "value stream progression"
    - id: AP-HUMAN-02
      label: Pattern B - Agent escalates to Human
      shape:
        - Agent
        - exception
        - Human
        - decision
        - Agent
    - id: AP-HUMAN-03
      label: Pattern C - Human decides, Agent executes
      shape:
        - Human
        - decision
        - Agent
        - execution
    - id: AP-HUMAN-04
      label: Pattern D - Agent decides, Human validates
      shape:
        - Agent
        - decision
        - Human
        - validation
        - execution
    - id: AP-HUMAN-05
      label: Pattern E - Shared progression
      shape:
        - "Human, Agent, Human, Agent (alternating)"
  principle: |
    Human participation is a valid realization pattern rather than an
    exception. All five patterns are valid provided the underlying AVS
    qualification conditions (CR-VAS-002) are satisfied.

  # CR-VAS-003 §14 - Agent semantics distinction.
  agent_semantics:
    agent: |
      A participating actor or implementation construct capable of
      performing delegated behavior.
    agentic_participation: |
      A semantic realization relationship in which agentic behavior
      contributes materially to Value Stream realization.
    agentic_value_stream: |
      A Value Stream that contains one or more qualifying instances of
      Agentic Participation.
    rule: |
      Agent != Agentic Participation != Agentic Value Stream.

  # CR-VAS-003 §15 - AI remains orthogonal.
  ai_orthogonality:
    valid_configurations:
      - AI + non-agentic
      - AI + agentic
      - non-AI + agentic
      - human + agentic
      - automation + agentic
      - AI + automation + agentic
    principle: |
      The presence of AI shall never itself satisfy AVS qualification.

  # CR-VAS-003 §16 - Automation remains distinct.
  automation_semantics:
    rule: Automation != Agentic Participation.
    principle: |
      Automation can participate in an AVS. For example, an Agent
      selects payment method, then an automated payment service
      executes the transaction. The automated component does not
      become agentic simply because it is downstream of an agent.

  # CR-VAS-003 §17 - Autonomy remains orthogonal.
  autonomy_semantics:
    principle: |
      Autonomy describes the degree of independent operation.
      Agenticity describes the presence of delegated, bounded,
      contextual, outcome-oriented action selection. A Value Stream
      may be: agentic + highly human-supervised; agentic + partially
      autonomous; or agentic + highly autonomous.

  # CR-VAS-003 §18 - Realization Composition replaces ambiguous single-axis
  # realization_mode semantics with explicit dimensions.
  realization_composition:
    composition_allowed:
      - human
      - automated
      - agentic
      - hybrid
    scope_uses_participation_scope: true
    autonomy_dimension_present: true
    human_involvement_dimension_present: true
    principle: |
      This avoids conflating composition with scope, authority,
      autonomy, and human involvement.

  # CR-VAS-003 §19 - Canonical Relationship Set.
  relationships:
    - from: Agentic Value Stream
      rel: specialises
      to: Value Stream
    - from: Agentic Value Stream
      rel: contains
      to: Agentic Participation
    - from: Agentic Participation
      rel: performed_by
      to: Actor/Agent
    - from: Agentic Participation
      rel: advances
      to: Entrusted Intent
    - from: Agentic Participation
      rel: governed_by
      to: Bounded Authority
    - from: Agentic Participation
      rel: interprets
      to: Context
    - from: Agentic Participation
      rel: selects
      to: Permissible Action
    - from: Agentic Participation
      rel: affects
      to: Value Stream Progression
    - from: Agentic Participation
      rel: contributes_to
      to: Value Outcome
    - from: Agentic Participation
      rel: may_escalate_to
      to: Human
    - from: Agentic Participation
      rel: occurs_within
      to: Value Stage
      note: where applicable
    - from: Agentic Participation
      rel: coordinates
      to: Participant
      note: where applicable

  # CR-VAS-003 §20 - Cardinality Principles.
  cardinality:
    value_stream_to_participation: 1..*
    participation_to_actor: 1
    participation_to_intent: 1
    participation_to_authority: 1
    participation_to_context: 1..*
    participation_to_actions: 1..*
    participation_to_value_contribution: 1
    participation_to_human_escalation: 0..*
    actor_to_participations: 0..*
    stage_to_participations: 0..*
    principle: |
      Not every Value Stage must be agentic. This is essential.

  # CR-VAS-003 §21 - Distributed and Hybrid Agentic Realization.
  distributed_realization:
    principle: |
      Distributed/hybrid agentic realization remains a single Value
      Stream. No parallel "Agentic Value Stream" needs to be
      constructed merely to represent the agentic portions.
    example:
      - stage: Stage A
        realization: Human
      - stage: Stage B
        realization: Agentic Participation
        actor: Agent
      - stage: Stage C
        realization: Automated Execution
      - stage: Stage D
        realization: Human + Agent

  # CR-VAS-003 §22 - Semantic Boundary Matrix (normative guidance).
  boundary_matrix:
    headers:
      - Has objective
      - Uses context
      - Selects action
      - Bounded authority
      - Material Value Stream effect
    rows:
      - concept: Deterministic automation
        cells: ["+/-", "No", "No", "No/implicit", "Yes"]
      - concept: AI recommendation
        cells: ["No", "Yes", "No", "No", "Potential"]
      - concept: Human discretion
        cells: ["Yes", "Yes", "Yes", "Yes", "Yes"]
      - concept: Agentic participation
        cells: ["Yes", "Yes", "Yes", "Yes", "Yes"]
      - concept: Autonomous system
        cells: ["Potential", "Yes", "Yes", "Variable", "Not necessarily"]
      - concept: Workflow
        cells: ["No", "Limited", "No", "No", "Potential"]
      - concept: AI system
        cells: ["Variable", "Variable", "Variable", "Variable", "Variable"]

  # CR-VAS-003 §23 - Evidence Model (preliminary, fully realised in CR-VAS-004).
  evidence_model:
    components:
      - intent
      - authority
      - context
      - alternatives
      - selection
      - action
      - outcome_effect
      - intervention
    principle: |
      Evidence answers: How do we know that this participation is
      actually agentic? This is particularly important for
      conformance, governance, assessment, and certification. Full
      evidence semantics are landed under CR-VAS-004.

  # CR-VAS-003 §28 - Machine-readable model (illustrative template).
  machine_readable_template:
    agentic_participation:
      required:
        - participant
        - intent
        - authority
        - context
        - action_selection
        - value_contribution
      scope:
        allowed:
          - decision
          - execution
          - coordination
          - stage
          - cross_stage
          - end_to_end
      relationships:
        performed_by: Actor
        may_be_realized_by: Agent
        occurs_within: ValueStage
        advances: Intent
        governed_by: Authority
        interprets: Context
        selects: Action
        contributes_to: ValueOutcome
        may_escalate_to: Human
      exclusions:
        - agent_presence_only
        - ai_presence_only
        - automation_only
        - recommendation_only
        - workflow_orchestration_only
    note: |
      This is illustrative; the exact schema is reconciled with the
      existing repository structure (concept.yaml participation block).

  # CR-VAS-003 §29 - Governance Rules.
  governance_rules:
    - id: AP-GOV-01
      label: Value Stream remains primary
      rule: Agentic semantics cannot redefine the underlying Value Stream.
    - id: AP-GOV-02
      label: Participation is explicit
      rule: |
        Agentic behavior should be represented explicitly rather than
        inferred solely from the presence of an Agent.
    - id: AP-GOV-03
      label: Authority is explicit
      rule: |
        An agent cannot be considered agentic solely because it can
        execute actions.
    - id: AP-GOV-04
      label: Materiality is mandatory
      rule: |
        Agentic behavior must materially contribute to Value Stream
        realization.
    - id: AP-GOV-05
      label: AI is implementation-independent
      rule: |
        No AI dependency shall be introduced into the semantic
        definition.
    - id: AP-GOV-06
      label: Autonomy is orthogonal
      rule: |
        Autonomy shall not be used as a proxy for agenticity.
    - id: AP-GOV-07
      label: Human participation is first-class
      rule: |
        Human involvement shall never invalidate AVS qualification.
    - id: AP-GOV-08
      label: No parallel value-stage ontology
      rule: |
        Agentic participation shall overlay canonical Value Stream
        semantics.

  # Cardinal author rule preserved.
  author: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)
  governance: enterprise-semantics

  provenance:
    decision: [ES-ADR-005, ES-ADR-031, ES-ADR-049, ES-ADR-051, ES-ADR-052, ES-ADR-053]
    implementation: [CR-ES-005, CR-AVS-001, CR-VAS-002, CR-VAS-003]
    reconciliation: CR-AVS-001
    qualification: CR-VAS-002
    participation_realization: CR-VAS-003


# === Evidence, Conformance & Qualification Validation Model (CR-VAS-004) ===

evidence_conformance:
  # Specialises the qualification + participation blocks established by
  # CR-VAS-002 + CR-VAS-003. CR-VAS-004 introduces the evidence model
  # that connects claim to evidence to validation to qualification
  # decision to conformance status.
  specializes: ES:CONCEPT:agentic-value-stream

  # CR-VAS-004 §3 - Normative Principle (Claim != Evidence != Validation).
  principle: |
    An AVS instance SHALL NOT be considered semantically conformant
    solely because it is named "agentic", contains an Agent, uses AI,
    uses an LLM, is autonomous, uses orchestration, adapts, or
    performs automated actions. The validation chain is:

    Claim -> Evidence -> Validation -> Qualification Decision -> Conformance Status.

  # CR-VAS-004 §4 - Three Levels of Evidence.
  evidence_levels:
    - id: AVS-EVL-01
      level: structural
      label: Structural Evidence
      definition: |
        Evidence that the required semantic relationships exist
        (Value Stream, Agentic Participation, Intent, Authority,
        Context, Action selection, Outcome contribution).
      question_answered: Is the required semantic structure represented?
    - id: AVS-EVL-02
      level: behavioral
      label: Behavioral Evidence
      definition: |
        Evidence that the represented participation actually behaves
        according to the semantics (interprets context, alternatives
        exist, selects among alternatives, authority boundaries
        enforced, escalation occurs, progression changes).
      question_answered: Does the realisation actually behave agentically?
    - id: AVS-EVL-03
      level: outcome
      label: Outcome Evidence
      definition: |
        Evidence that agentic participation materially contributes
        to Value Stream realisation (altered progression, consequential
        decision, materially different action, improved/changed value
        realisation, successful resolution of contextual variation).
      question_answered: Does the agentic behavior materially matter to the Value Stream?

  # CR-VAS-004 §5 - Qualification Evidence Chain (mandatory sequence).
  evidence_chain:
    - step: 1
      element: Value Stream
    - step: 2
      element: Agentic Participation
    - step: 3
      element: Entrusted Intent
    - step: 4
      element: Bounded Authority
    - step: 5
      element: Contextual Interpretation
    - step: 6
      element: Permissible Alternatives
    - step: 7
      element: Action / Progression Selection
    - step: 8
      element: Material Value Contribution
  principle_chain: |
    A missing mandatory link SHALL prevent full semantic qualification.

  # CR-VAS-004 §6 - Evidence Requirements by Qualification Condition.
  evidence_requirements:
    value_stream_foundation:
      minimum: Canonical Value Stream reference
    material_agentic_participation:
      minimum: Explicit participation point and materiality rationale
    delegated_intent:
      minimum: Declared objective / outcome
    bounded_authority:
      minimum: Authority boundary and constraints
    contextual_interpretation:
      minimum: Context inputs / signals
    permissible_action_selection:
      minimum: Two or more valid alternatives or progression paths
    value_realization_effect:
      minimum: Observable material contribution

  # CR-VAS-004 §7 - Evidence Sufficiency vocabulary.
  evidence_status:
    - id: sufficient
      label: Sufficient
      definition: Evidence supports the relevant qualification condition.
    - id: partial
      label: Partial
      definition: Some evidence exists but does not fully establish the condition.
    - id: insufficient
      label: Insufficient
      definition: The condition is asserted but not demonstrated.
    - id: contradictory
      label: Contradictory
      definition: Available evidence conflicts with the qualification claim.
    - id: unverifiable
      label: Unverifiable
      definition: Evidence is referenced but cannot be independently inspected or validated.

  # CR-VAS-004 §8 - Mandatory vs Supporting Evidence.
  mandatory_evidence:
    - value_stream_identity
    - agentic_participation
    - intent
    - authority
    - context
    - alternative_selection
    - material_value_contribution
  supporting_evidence:
    - ai_model_information
    - agent_architecture
    - automation_architecture
    - autonomy_level
    - performance_metrics
    - intervention_statistics
    - implementation_technology
    - training_data
    - model_evaluation
  principle_supporting: |
    Supporting evidence is useful but NOT mandatory. This prevents
    implementation details from replacing semantic evidence.

  # CR-VAS-004 §9 - Evidence Independence (no circular evidence).
  evidence_independence:
    principle: |
      The same evidence SHALL NOT automatically satisfy multiple
      independent semantic conditions. The validation framework SHALL
      avoid circular evidence.
    example: |
      "The agent has access to customer data" may support contextual
      access but does NOT establish delegated intent, authority,
      action selection, or outcome contribution.

  # CR-VAS-004 §10 - Evidence Provenance (machine-readable).
  evidence_provenance_template:
    id:
    type:
    description:
    source:
    source_type:
      allowed:
        - design_document
        - architecture_model
        - policy
        - configuration
        - execution_trace
        - decision_log
        - audit_record
        - test_result
        - simulation
        - human_review
        - system_observation
        - measurement
    observed_at:
    provided_by:
    validated_by:
    validation_method:
    confidence:
      allowed: [high, medium, low, unknown]

  # CR-VAS-004 §11 - Evidence Confidence (cannot override missing mandatory).
  evidence_confidence:
    levels: [high, medium, low, unknown]
    principle: |
      Confidence SHALL NOT override a missing mandatory semantic
      condition. High-confidence evidence of AI usage cannot
      compensate for absent evidence of delegated intent or bounded
      authority.

  # CR-VAS-004 §12 - Qualification Decision Model.
  qualification_decision_model:
    steps:
      - question: Value Stream?
        outcome: must be YES
      - question: Agentic Participation?
        outcome: must be YES
      - question: Intent + Authority + Context + Selection?
        outcome: must be YES
      - question: Material Value Contribution?
        outcome: must be YES
      - result: AVS QUALIFIED
    principle: |
      Any mandatory condition failing SHALL prevent a qualified status.

  # CR-VAS-004 §13 - Conformance Status vocabulary.
  conformance_status:
    - id: claimed
      label: Claimed
      definition: The owner asserts that the instance is an AVS.
    - id: under_review
      label: Under Review
      definition: Evidence is being assessed.
    - id: conditionally_conformant
      label: Conditionally Conformant
      definition: Most conditions are satisfied but defined exceptions or evidence gaps remain.
    - id: conformant
      label: Conformant
      definition: All mandatory semantic requirements are satisfied.
    - id: non_conformant
      label: Non-Conformant
      definition: One or more mandatory requirements fail.
    - id: expired
      label: Expired
      definition: Previously conformant evidence is no longer current or valid.

  # CR-VAS-004 §14 - Semantic Conformance vs Maturity (prohibition).
  conformance_vs_maturity:
    rule: |
      Conformance != Maturity. An organisation can have a highly
      mature implementation that is not semantically Agentic, or a
      semantically conformant AVS that is operationally immature.
    chain:
      - Semantic Qualification
      - Conformance
      - Operational Capability
      - Maturity
    principle: |
      Maturity SHALL be addressed in a subsequent CR
      (CR-VAS-006), NOT here.

  # CR-VAS-004 §15 - Qualification Evidence Record (machine-readable).
  qualification_evidence_record_template:
    qualification:
      status: conformant
      value_stream:
        id:
        reference:
      agentic_participation:
        id:
        scope:
        location:
      evidence:
        value_stream_semantics:
          status: sufficient
          references: []
        delegated_intent:
          status: sufficient
          references: []
        bounded_authority:
          status: sufficient
          references: []
        contextual_interpretation:
          status: sufficient
          references: []
        permissible_action_selection:
          status: sufficient
          references: []
        value_realization_effect:
          status: sufficient
          references: []
      validation:
        method:
        validator:
        validated_at:
    note: |
      This is illustrative. The exact schema is reconciled with the
      repository's existing schema conventions.

  # CR-VAS-004 §16 - Materiality Evidence (counterfactual rationale).
  materiality_evidence:
    question: |
      If the agentic participation were removed and replaced by a
      non-agentic realisation, would the Value Stream's progression,
      consequential decisions, or realisation of stakeholder value
      materially change?
    structure:
      materiality:
        test:
        result: true
        rationale:
        evidence:
    principle: |
      A simple assertion of true without rationale SHALL be insufficient.

  # CR-VAS-004 §17 - Counterfactual Validation (baseline vs candidate).
  counterfactual_validation:
    principle: |
      Materiality SHOULD preferably be tested through a counterfactual.
    baseline: Actual agentic realisation.
    counterfactual: Equivalent non-agentic realisation.
    comparison_dimensions:
      - progression
      - decisions
      - action_selection
      - outcome
      - intervention
      - value_realization
    conclusion_form: |
      A materially differs from B -> Materiality supported.
    principle_execution: |
      The counterfactual need not always be executed in production.
      It MAY be demonstrated through simulation, historical replay,
      controlled testing, or analytical reasoning.

  # CR-VAS-004 §18 - Behavioral Test Model.
  behavioral_test_template:
    test:
      id:
      purpose:
      preconditions:
      context:
      available_actions:
      authority:
      expected_selection:
      expected_progression:
      expected_outcome:
      evidence:
      result:
    principle: |
      This allows the repository to test not merely whether fields
      exist, but whether the represented AVS actually behaves
      according to its semantic claims.

  # CR-VAS-004 §19 + §20 - Positive + Negative Conformance Tests.
  # (Implemented in kit/ as cf-positive-01..08 + cf-negative-01..10.)
  positive_test_set:
    - id: VAS-CF-P01
      label: Delegated Outcome
    - id: VAS-CF-P02
      label: Contextual Selection
    - id: VAS-CF-P03
      label: Bounded Authority
    - id: VAS-CF-P04
      label: Material Progression
    - id: VAS-CF-P05
      label: Human-Agent Hybrid
    - id: VAS-CF-P06
      label: Non-AI Agentic
    - id: VAS-CF-P07
      label: Localised Agenticity
    - id: VAS-CF-P08
      label: Multi-Agent Coordination
  negative_test_set:
    - id: VAS-CF-N01
      label: AI Only
    - id: VAS-CF-N02
      label: Agent Label Only
    - id: VAS-CF-N03
      label: Workflow Only
    - id: VAS-CF-N04
      label: Recommendation Only
    - id: VAS-CF-N05
      label: Fixed Automation
    - id: VAS-CF-N06
      label: Autonomous System Without Value Materiality
    - id: VAS-CF-N07
      label: Human Routine Execution
    - id: VAS-CF-N08
      label: Missing Authority
    - id: VAS-CF-N09
      label: Missing Selection
    - id: VAS-CF-N10
      label: Non-Material Agentic Behavior

  # CR-VAS-004 §21 - Boundary Test Matrix.
  boundary_test_matrix:
    - scenario: LLM generates a response
      agentic: not_necessarily
      reason: No delegated action authority.
    - scenario: AI recommends an action
      agentic: not_necessarily
      reason: Recommendation != selection.
    - scenario: Agent selects within policy
      agentic: yes_if_material
      reason: Delegated bounded selection.
    - scenario: RPA executes fixed workflow
      agentic: no
      reason: Deterministic execution.
    - scenario: Autonomous vehicle performs transport
      agentic: not_automatically
      reason: Autonomous != AVS.
    - scenario: Human resolves exceptional case
      agentic: potentially
      reason: Conditions must be satisfied.
    - scenario: Agent routes tickets using fixed rules
      agentic: no
      reason: Routing alone insufficient.
    - scenario: Agent selects customer remediation
      agentic: potentially_yes
      reason: Depends on authority/materiality.
    - scenario: Multi-agent negotiation affects fulfillment
      agentic: potentially_yes
      reason: Requires qualification evidence.
    - scenario: AI forecasts demand
      agentic: no
      reason: Prediction != agentic realisation.

  # CR-VAS-004 §22 - Human Validation (machine + evidence + review).
  human_validation:
    principle: |
      Automated validation SHALL NOT be the sole mechanism for
      semantic qualification. Certain questions require semantic
      judgement: whether authority is genuinely delegated, whether
      action alternatives are meaningful, whether participation is
      material, whether the claimed outcome is genuinely a Value
      Stream outcome.
    chain:
      - Machine validation
      - Evidence inspection
      - Semantic review

  # CR-VAS-004 §23 - Validation Roles (separated from semantics).
  validation_roles:
    - id: instance_owner
      label: Instance Owner
      responsibility: Responsible for making the AVS claim and supplying evidence.
    - id: semantic_validator
      label: Semantic Validator
      responsibility: Evaluates conformance against the Agentic Value Stream specification.
    - id: domain_reviewer
      label: Domain Reviewer
      responsibility: Validates domain-specific interpretation where required.
    - id: governance_authority
      label: Governance Authority
      responsibility: May approve formal certification where organisational governance requires it.
  principle: |
    These roles SHALL NOT be embedded as semantic requirements for
    being an AVS.

  # CR-VAS-004 §24 - Evidence Lifecycle.
  evidence_lifecycle:
    stages:
      - Created
      - Submitted
      - Validated
      - Accepted
      - Monitored
      - Revalidated
      - Expired / Superseded
    principle: |
      A conformance claim is therefore potentially time-bound.

  # CR-VAS-004 §25 - Conformance Drift (semantic drift detection).
  conformance_drift:
    principle: |
      The repository SHOULD support detection of semantic drift.
    triggers:
      - authority_changed
      - agent_behavior_changed
      - workflow_changed
      - value_stream_changed
      - agentic_participation_removed
      - action_space_changed
      - policy_changed
      - human_escalation_removed
      - materiality_changed
    principle_consequence: |
      A previously conformant instance MAY therefore become
      non-conformant. This is different from maturity deterioration.

  # CR-VAS-004 §26 - Evidence Freshness.
  evidence_freshness_template:
    freshness:
      valid_from:
      valid_until:
      review_interval:
    principle: |
      Evidence freshness SHOULD be determined according to the
      volatility of the underlying semantic claim. Static Value Stream
      definition is relatively stable. Agent authority configuration
      is potentially volatile. Runtime decision behavior is highly
      dynamic.

  # CR-VAS-004 §27 - Conformance Levels (binary at semantic boundary).
  conformance_levels:
    principle: |
      The repository SHALL NOT create multiple levels of "agenticity".
      That would risk confusing semantic qualification with maturity.
    allowed_states:
      - Not Qualified
      - Qualified
      - Conditionally Conformant
      - Conformant
    principle_separated: |
      Maturity is evaluated separately in a future specification
      (CR-VAS-006). The concept itself remains binary at the semantic
      boundary: Does the instance satisfy the Agentic Value Stream
      definition or not?

  # CR-VAS-004 §28 - Conformance Kit Architecture (evolved).
  conformance_kit_architecture:
    principle: |
      The existing conformance kit SHOULD evolve toward:
        kit/
        +-- kit.yaml
        +-- schema/
        +-- positive/
        +-- negative/
        +-- boundary/
        +-- structural/
        +-- behavioral/
        +-- evidence/
        +-- expected-results/
      The exact directory names follow the repository's established
      convention where possible.
    machine_readable_metadata:
      - test_id
      - test_type
      - qualification_condition
      - expected_result
      - evidence_requirement
      - rationale

  # CR-VAS-004 §29 - Conformance Result (machine-readable).
  conformance_result_template:
    result:
      test_id:
      status:
        allowed: [pass, fail, inconclusive, not_applicable]
      qualification_condition:
      evidence:
      observations:
      rationale:
    principle: |
      Inconclusive SHALL be distinguished from fail. Absence of
      evidence is NOT necessarily evidence of semantic failure; it
      MAY indicate insufficient evidence. However, an instance
      cannot become fully conformant while mandatory evidence
      remains inconclusive.

  # CR-VAS-004 §30 - Qualification Decision Rules.
  qualification_decision_rules:
    if:
      - value_stream_semantics = PASS
      - all_mandatory_AVS_conditions = PASS
      - materiality = PASS
      - no_exclusion = triggered
    then: CONFORMANT
    else_if:
      - mandatory_evidence_incomplete
    then: UNDER_REVIEW / CONDITIONALLY_CONFORMANT
    else: NON_CONFORMANT
    principle: |
      A triggered exclusion SHALL override superficial positive evidence.

  # CR-VAS-004 §32 - Conformance Evidence vs Operational Telemetry.
  telemetry_vs_evidence:
    principle: |
      Runtime telemetry can provide evidence but SHALL NOT become the
      semantic definition. Telemetry is evidence, not semantics.
    example: |
      "Agent made 10,000 decisions" does NOT establish that those
      decisions were delegated, bounded, contextual, or materially
      consequential.

  # CR-VAS-004 §33 - Conformance and Governance Separation.
  conformance_governance_separation:
    semantic_specification: |
      What MUST be true.
    governance_framework: |
      Who is authorised to certify that it is true.
    principle: |
      These SHALL remain separate. This prevents organisational
      governance requirements from contaminating the universal
      semantic definition.

  # Cardinal author rule preserved.
  author: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)
  governance: enterprise-semantics

  provenance:
    decision: [ES-ADR-005, ES-ADR-031, ES-ADR-049, ES-ADR-051, ES-ADR-052, ES-ADR-053, ES-ADR-054]
    implementation: [CR-ES-005, CR-AVS-001, CR-VAS-002, CR-VAS-003, CR-VAS-004]
    reconciliation: CR-AVS-001
    qualification: CR-VAS-002
    participation_realization: CR-VAS-003
    evidence_conformance: CR-VAS-004


# ============================================================
# CR-VAS-005 ; Measurement & Operational Value Model
# Per CR-VAS-005 (2026-10-08) ; ES-ADR-055 + CR-VAS-005
# Cardinal author rule: Emmanuel A. Otchere (2026-09-23)
# D-004: 0 en/em/triple-em dash ; 0 TMForum ; 0 vendor specifics
# ============================================================

measurement:

  specializes: ES:CONCEPT:agentic-value-stream

  principle: |
    Measurement evaluates an already-qualified and conformant AVS
    implementation. Measurement does NOT determine whether the
    underlying concept is semantically an AVS. The single most
    important design decision in CR-VAS-005 is: do not allow
    measurement to become a backdoor definition of agenticity.
    Activity != Effectiveness != Business Value.

  normative_question: |
    Does agentic participation improve or materially contribute to
    the realization of Value Stream outcomes within acceptable
    authority, risk, cost, and intervention boundaries?

  hierarchy:
    description: |
      Five-level measurement hierarchy. Prevents dashboards from
      becoming collections of low-level telemetry.
    levels:
      - id: activity
        question: What happened?
      - id: behavior
        question: How did the agent behave?
      - id: performance
        question: How well did it perform?
      - id: value
        question: What value did it create or protect?
      - id: strategic_effect
        question: What changed because of agentic realization?

  dimensions:
    - id: value_realization
      primary: true
      description: |
        Primary dimension. Measures whether agentic participation
        improves the intended Value Stream outcome.
      metrics:
        - outcome_realization_rate
        - outcome_quality
        - value_leakage
        - value_recovery
        - exception_resolution_rate
        - time_to_outcome
        - outcome_variance
        - customer_stakeholder_outcome
    - id: agentic_effectiveness
      description: |
        Whether agentic behavior functions as intended.
      metrics:
        - delegation_success_rate
        - context_utilization_rate
        - action_selection_effectiveness
        - adaptive_progression_effectiveness
        - agentic_resolution_rate
        - agentic_decision_density
        - agentic_action_selection_rate
        - authority_utilization
    - id: decision_quality
      description: |
        Distinguish decision quality, action quality, and outcome
        quality. They are NOT equivalent.
      metrics:
        - decision_acceptance_rate
        - action_success_rate
        - action_reversal_rate
        - decision_override_rate
        - rework_rate
        - exception_rate
        - downstream_defect_rate
        - policy_compliance_rate
    - id: human_intervention
      description: |
        Human intervention is an explicit dimension, NOT
        automatically treated as failure.
      metrics:
        - intervention_rate
        - intervention_effectiveness
        - escalation_precision
        - escalation_miss_rate
        - intervention_success_rate
        - intervention_reversal_rate
        - intervention_induced_delay
        - unnecessary_intervention_rate
    - id: authority_and_risk
      description: |
        Risk introduced by delegated authority.
      metrics:
        - boundary_compliance_rate
        - boundary_exception_rate
        - unauthorized_action_rate
        - constraint_violation_rate
        - escalation_failure_rate
        - risk_adjusted_outcome
        - risk_adjusted_value
    - id: operational_efficiency
      description: |
        Operational efficiency. Distinguished from value realization.
      metrics:
        - cost_per_outcome
        - cost_per_successful_resolution
        - time_per_outcome
        - throughput
        - capacity_utilization
        - human_effort_avoided
        - human_effort_redirected
        - infrastructure_cost
        - agent_execution_cost
        - exception_handling_cost
        - value_stream_cycle_time

  conditional_metrics:
    description: |
      Metrics applicable ONLY where relevant. Distinguish from
      universal measurement dimensions.
    categories:
      - id: multi_agent
        conditional: true
        description: For multi-agent or distributed AVS implementations.
        metrics:
          - coordination_success_rate
          - coordination_latency
          - coordination_conflict_rate
          - duplicate_action_rate
          - inter_agent_escalation_rate
          - coordination_failure_rate
          - shared_state_inconsistency
          - coordination_induced_rework
      - id: adaptive_progression
        conditional: true
        description: Where adaptive progression is present.
        metrics:
          - adaptation_rate
          - adaptation_effectiveness
          - adaptation_reversal_rate
          - adaptation_stability
      - id: ai_specific
        conditional: true
        description: Where AI implementation technology is used.
        metrics:
          - model_latency
          - model_quality
          - model_evaluation
      - id: autonomy_specific
        conditional: true
        description: Where autonomy is present.
        metrics:
          - autonomy_level
          - autonomy_exercised

  baselines:
    description: |
      A baseline is REQUIRED wherever an improvement claim is made.
      The baseline SHALL be declared explicitly.
    types:
      - historical
      - human_only
      - automated
      - pre_agentic
      - controlled
      - counterfactual
      - benchmark
    principle: |
      An assertion such as "agentic implementation improved
      efficiency by 40%" SHALL NOT be considered complete without
      identifying the comparison baseline.

  counterfactual_comparison:
    description: |
      Where feasible, the repository SHOULD support comparison
      against a baseline. The preferred measurement construct is:
      Incremental AVS Value = AVS Result - Comparable Baseline
      Result. This is substantially more meaningful than measuring
      agentic activity alone.
    baselines:
      - human_only
      - automation_only
      - existing_operating_model
      - historical
      - controlled_experiment
      - simulation

  measurement_context:
    description: |
      Every measurement SHALL identify its Value Stream context.
      This avoids orphan metrics that cannot be interpreted
      semantically.
    required_fields:
      - id
      - value_stream
      - agentic_participation
      - metric
      - definition
      - unit
      - population
      - period
      - baseline
      - observed_value
      - target
      - threshold
      - provenance

  value_attribution:
    description: |
      Attributing Value Stream improvement solely to agentic
      participation is difficult. Other factors may change
      simultaneously (process redesign, technology modernization,
      workforce changes, market conditions, policy changes, product
      changes, organizational restructuring).
    schema:
      attribution:
        contribution:
        confidence: high | medium | low | unknown
        basis:
    possible_confidences:
      - high
      - medium
      - low
      - unknown

  provenance:
    description: |
      Every reported metric SHOULD be traceable:
      Value Stream -> Agentic Participation -> Observed Events ->
      Measurement -> Outcome. This allows measurements to remain
      semantically anchored.
    chain:
      - value_stream
      - agentic_participation
      - observed_events
      - measurement
      - outcome

  lifecycle:
    description: |
      Measurements SHALL support a lifecycle that distinguishes a
      metric definition from an operationally trusted measurement.
    stages:
      - defined
      - instrumented
      - collected
      - validated
      - analyzed
      - acted_upon
      - reviewed

  quality_dimensions:
    description: |
      A metric without reliable measurement provenance SHALL NOT be
      treated as equivalent to a validated metric.
    dimensions:
      - accuracy
      - completeness
      - timeliness
      - consistency
      - traceability
      - comparability

  anti_patterns:
    description: |
      Explicit anti-patterns. Each represents a way that
      measurement can become a backdoor definition of agenticity.
    items:
      - id: agent_count_as_value
        claim: "More agents = more value."
        verdict: false
      - id: autonomy_as_performance
        claim: "More autonomy = better performance."
        verdict: false
      - id: automation_rate_as_agenticity
        claim: "More automated = more agentic."
        verdict: false
      - id: decision_volume_as_effectiveness
        claim: "More agent decisions = better AVS."
        verdict: false
      - id: intervention_minimization
        claim: "Less human intervention = better AVS."
        verdict: false
      - id: ai_model_quality_as_value
        claim: "Model quality = Value Stream value."
        verdict: false
      - id: cost_reduction_as_sole_value
        claim: "Cost reduction is the only value."
        verdict: false
        note: |
          Agentic Value Streams may create value through quality,
          speed, resilience, customer experience, risk reduction,
          innovation, capacity, revenue, decision quality.

  separation_principles:
    description: |
      CR-VAS-005 explicitly separates measurement from semantic
      qualification, conformance, and maturity.
    principles:
      - id: measurement_vs_qualification
        statement: |
          CR-VAS-002 establishes what makes a Value Stream
          Agentic. CR-VAS-005 may use qualification evidence as a
          measurement input but SHALL NOT replace it.
      - id: measurement_vs_conformance
        statement: |
          CR-VAS-004 establishes whether semantic conditions are
          satisfied. CR-VAS-005 may use conformance evidence as a
          measurement input but SHALL NOT replace it. A poorly
          performing AVS can remain semantically conformant. A
          high-performing automated system can remain
          non-conformant.
      - id: measurement_vs_maturity
        statement: |
          CR-VAS-005 SHALL NOT introduce maturity levels such as
          L1 = basic, L2 = managed, L3 = optimized measurement.
          Maturity belongs to CR-VAS-006.

  measurement_to_semantics_traceability:
    description: |
      Every core metric SHALL be traceable back to the semantic
      model. Prevents the measurement framework from becoming
      disconnected from semantics.
    mappings:
      - semantic: delegated_intent
        metric: outcome_realization_rate
      - semantic: bounded_authority
        metric: authority_compliance_rate
      - semantic: contextual_interpretation
        metrics:
          - context_utilization
          - adaptation_effectiveness
      - semantic: action_selection
        metric: action_selection_effectiveness
      - semantic: material_value_contribution
        metrics:
          - incremental_value
          - outcome_improvement
      - semantic: human_intervention
        metric: intervention_effectiveness

  core_metric_set:
    description: |
      Recommended core measures for a minimum AVS operational
      dashboard. These are recommended, not semantic qualification
      requirements.
    items:
      - outcome_realization_rate
      - incremental_value_vs_baseline
      - time_to_outcome
      - agentic_decision_selection_rate
      - action_success_rate
      - authority_compliance_rate
      - boundary_exception_rate
      - human_intervention_rate
      - intervention_effectiveness
      - cost_per_outcome
      - rework_reversal_rate
      - value_stream_throughput

  interpretation_rules:
    description: |
      Critical interpretive cautions. Activity != Effectiveness.
      Lower is not inherently better. Higher is not inherently
      better.
    rules:
      - id: authority_utilization_diagnostic
        statement: |
          Authority utilization is diagnostic, not inherently
          positive. Low utilization may indicate overly broad
          authority, insufficient delegation, low complexity,
          conservative behavior, or effective human intervention.
          High utilization may indicate appropriate delegation,
          excessive delegation, weak constraints, or unusually
          high case complexity.
      - id: intervention_rate_not_better_when_lower
        statement: |
          Lower intervention is NOT inherently better. An
          appropriate intervention rate may be desirable in high-risk
          Value Streams.
      - id: decision_density_not_maturity
        statement: |
          Higher agentic decision density SHALL NOT be interpreted
          as higher maturity. In some Value Streams, fewer
          agentic decisions may be preferable.
      - id: adaptation_not_proof_of_agenticity
        statement: |
          Adaptation is measurable but is NOT itself proof of
          agenticity.
      - id: action_execution_distinct_from_selection
        statement: |
          Action Selection Rate SHOULD be distinguished from Action
          Execution Rate, because execution may be automated after
          an agent makes the selection.
      - id: multi_agent_optional
        statement: |
          A single-agent AVS SHALL NOT be required to implement
          multi-agent metrics.

  machine_readable_model:
    description: |
      Semantic template. NOT a requirement that every AVS implement
      every metric.
    dimensions:
      value_realization:
        metrics:
          - outcome_realization_rate
          - incremental_value
          - time_to_outcome
      agentic_effectiveness:
        metrics:
          - action_selection_rate
          - action_success_rate
          - agentic_resolution_rate
      decision_quality:
        metrics:
          - decision_acceptance_rate
          - override_rate
          - reversal_rate
      human_intervention:
        metrics:
          - intervention_rate
          - intervention_effectiveness
          - escalation_precision
      authority_and_risk:
        metrics:
          - authority_compliance_rate
          - boundary_exception_rate
          - constraint_violation_rate
      operational_efficiency:
        metrics:
          - cost_per_outcome
          - throughput
          - cycle_time
          - rework_rate

  relationship_to_conformance:
    conformance_status: |
      Conformance asks "Is this actually AVS?" Measurement asks
      "How well is the AVS performing?" They are SEPARATE
      questions. CR-VAS-004 conformance evidence may be a
      measurement input but SHALL NOT replace measurement.
    separation_examples:
      - example: poorly_performing_conformant
        statement: A poorly performing AVS can remain semantically conformant.
      - example: high_performing_non_conformant
        statement: A high-performing automated system can remain non-conformant.

  human_effort_reallocation:
    description: |
      Particularly important measure: what happened to human
      effort as a result of agentic realization?
    categories:
      - human_effort_eliminated
      - human_effort_reduced
      - human_effort_redirected
      - human_effort_increased
    principle: |
      The objective SHALL NOT be defined as workforce reduction.
      In many Value Streams, the greater value may come from
      moving human effort toward complex decisions, relationship
      management, innovation, exception handling, strategic work.

  cycle_time_decomposition:
    description: |
      Where appropriate, AVS Cycle Time SHOULD be compared against
      Baseline Cycle Time.
    decomposition:
      - decision_time
      - agent_execution_time
      - human_intervention_time
      - waiting_time
      - exception_time

  reference_examples:
    description: |
      At least four reference examples SHOULD be provided.
    items:
      - id: customer_service_avs
        measures:
          - resolution_rate
          - time_to_resolution
          - escalation
          - intervention
          - customer_outcome
      - id: procurement_avs
        measures:
          - sourcing_cycle_time
          - negotiated_value
          - policy_compliance
          - exception_rate
          - human_intervention
      - id: operations_avs
        measures:
          - throughput
          - incident_resolution
          - boundary_violations
          - intervention
          - cost_per_outcome
      - id: multi_agent_avs
        measures:
          - coordination_success
          - coordination_latency
          - conflict
          - outcome_realization

  boundary_assertions:
    per_cr_vas_005_measurement_value: |
      Per CR-VAS-005, measurement SHALL be separated from
      semantic qualification, conformance, and maturity. Activity
      SHALL NOT be conflated with effectiveness or business
      value.

  # ============================================================
  # Promotion history update (v1.2.0 -> v1.3.0)
  # ============================================================

# version: 1.3.0
# date: 2026-10-08

# === Maturity & Capability (CR-VAS-006) ===
#
# Per CR-VAS-006 (Agentic Value Stream Maturity & Capability Progression):
# Adds the `maturity:` block formalising:
#   (1) the maturity principle (one-directional dependency on
#       qualification, conformance, and measurement),
#   (2) separation principles (maturity != qualification != conformance
#       != measurement),
#   (3) six maturity levels (L0 Unaware -> L5 Scaled & Adaptive),
#   (4) six capability dimensions (C1 Design & Semantic Modeling,
#       C2 Authority/Governance/Risk, C3 Operational Realization,
#       C4 Value & Performance Management, C5 Learning & Improvement,
#       C6 Portfolio Scaling & Enterprise Integration),
#   (5) the capability progression matrix (per dimension x level),
#   (6) the multidimensional assessment rule (gated minimum, not
#       arithmetic mean),
#   (7) mandatory level gates (L2 / L3 / L4 / L5),
#   (8) evidence requirements by level,
#   (9) maturity anti-patterns (maturity != autonomy, != AI
#       sophistication, != agent count, != automation percentage, !=
#       intervention reduction, != cost reduction, != production
#       deployment, != semantic complexity),
#   (10) the human participation guarantee (human intervention is not
#        inherently a maturity defect),
#   (11) maturity != full automation (optimal delegation, not maximum
#        delegation),
#   (12) the capability lifecycle (Discover -> Qualify -> Design ->
#        Conform -> Deploy -> Measure -> Improve -> Scale -> Reassess),
#   (13) maturity transition criteria (demonstrated capability, not
#        elapsed time),
#   (14) maturity regression support (L4 -> L3 is valid),
#   (15) the maturity schema (machine-readable model declaration),
#   (16) the maturity assessment record template,
#   (17) the capability gap model,
#   (18) maturity improvement planning (Current -> Gap -> Evidence ->
#        Initiative -> Implementation -> Measurement -> Reassessment),
#   (19) the relationship to enterprise architecture (informs but is
#        not a generic enterprise digital maturity model),
#   (20) governance roles (Capability Owner, Value Stream Owner,
#        Agentic Solution Owner, Risk/Governance Owner, Semantic
#        Steward, Measurement/Value Owner),
#   (21) assessment frequency (periodic + event-triggered),
#   (22) 12 normative invariants (AVS-MAT-INV-001..012), and
#   (23) positive + negative maturity tests (10 + 10 boundary = 30).
#
# Cardinal author rule: Emmanuel A. Otchere <emmanuel@otchere.com>
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-10-08)
# Last revised: 2026-10-08 (CR-VAS-006 maturity block landed)

maturity:

  specializes: ES:CONCEPT:agentic-value-stream

  # ----------------------------------------------------------------
  # 1. Principle
  # ----------------------------------------------------------------
  principle: |
    Maturity measures the organization's capability to realize,
    govern, operate, measure, improve, and scale Agentic Value
    Streams. Maturity does NOT determine whether a Value Stream is
    Agentic. The dependency is intentionally one-directional:

      Semantic Qualification  (Is it AVS?)
        -> Conformance & Evidence  (Is the claim valid?)
          -> Operational Measurement  (How well does it perform?)
            -> Maturity & Capability  (How systematically can the
               organization operate, govern, improve and scale it?)

    A high-maturity organization may operate non-agentic Value
    Streams. A low-maturity organization may operate a semantically
    conformant AVS. A highly performant AVS does not automatically
    imply organizational maturity.

  # ----------------------------------------------------------------
  # 2. Normative question
  # ----------------------------------------------------------------
  normative_question: |
    How systematically and repeatedly can the organization design,
    govern, operate, measure, improve, and scale Agentic Value
    Streams at acceptable risk and sustainable cost?

  # ----------------------------------------------------------------
  # 3. Separation principles (maturity vs other layers)
  # ----------------------------------------------------------------
  separation:
    vs_qualification: |
      Qualification asks "Is this an Agentic Value Stream?" Maturity
      asks "How capable is the organization at managing it?"
      Qualification is a property of the candidate. Maturity is a
      property of the organization.
    vs_conformance: |
      Conformance asks "Does the implementation satisfy AVS semantic
      rules?" Maturity asks "How systematically can the organization
      operate, govern, and improve such conformant implementations?"
      Conformance is a binary-or-graded semantic verdict; maturity is
      a multi-dimensional organizational profile.
    vs_measurement: |
      Measurement asks "How well is this AVS performing?" Maturity
      asks "How capable is the organization at measurement, value
      attribution, risk management, and continuous improvement?"
      Measurement is an evaluation layer; maturity is an organizational
      capability assessment over that layer plus governance, design,
      operations, learning, and scaling.
    one_directional_dependency: |
      Maturity SHALLOW NOT redefine AVS semantics. Maturity levels
      SHALLOW NOT be used as evidence of agenticity. AI adoption,
      agent count, autonomy percentage, model sophistication, and
      operational scale SHALLOW NOT establish maturity on their own.

  # ----------------------------------------------------------------
  # 4. Maturity architecture
  # ----------------------------------------------------------------
  architecture:
    levels: maturity_levels
    dimensions: capability_dimensions
    evidence: maturity_evidence
    outputs:
      - overall_level
      - dimensional_profile
      - limiting_dimensions
      - capability_gaps

  # ----------------------------------------------------------------
  # 5. Maturity levels (L0-L5)
  # ----------------------------------------------------------------
  maturity_levels:
    description: |
      Six levels of organizational AVS capability. Levels represent
      increasing organizational capability, not increasing agenticity.
    items:
      - id: L0
        name: unaware
        meaning: No deliberate AVS capability.
        characteristic: |
          The organization has no systematic understanding or
          deliberate management of Agentic Value Stream concepts.
          Agentic behavior may exist incidentally. The organization
          simply lacks the capability to manage it systematically.
      - id: L1
        name: aware
        meaning: AVS concepts understood and identified.
        minimum_capability: |
          The organization can answer: "Where might agentic
          participation exist in our Value Streams?" It cannot yet
          demonstrate consistent enterprise-wide governance.
      - id: L2
        name: defined
        meaning: AVS practices, boundaries and governance are defined.
        minimum_capability: |
          The organization can consistently answer: "Is this Value
          Stream genuinely Agentic, how is the participation realized,
          what authority exists, and what evidence supports the
          claim?"
      - id: L3
        name: implemented
        meaning: Conformant AVS implementations operate in production.
        critical_distinction: |
          A pilot or prototype is NOT automatically L3. The
          organization must demonstrate operational realization, not
          merely architectural intent.
      - id: L4
        name: managed
        meaning: AVS performance, risk, value and improvement are
          systematically managed.
        minimum_capability: |
          The organization can answer: "Are our Agentic Value Streams
          producing superior or appropriate outcomes, at acceptable
          risk and cost, and what should we change?"
      - id: L5
        name: scaled-adaptive
        meaning: AVS capability is governed and continuously optimized
          across the enterprise.
        important_limitation: |
          L5 does NOT mean "everything is autonomous." It means the
          organization can deliberately and safely determine where
          agentic participation creates value, establish appropriate
          authority, operate it at scale, measure its effects, and
          continuously adapt the capability.

  # ----------------------------------------------------------------
  # 6. Capability dimensions (C1-C6)
  # ----------------------------------------------------------------
  capability_dimensions:
    description: |
      Maturity SHALL be assessed across six capability dimensions.
      A single arithmetic average SHALL NOT be the default
      maturity mechanism; instead, the profile SHALL remain visible
      with per-dimension levels and limiting dimensions called out.
    items:
      - id: C1
        name: design_semantics
        description: AVS Design & Semantic Modeling.
        includes:
          - value_stream_identification
          - agentic_participation_modeling
          - agentic_scope_determination
          - intent_modeling
          - authority_modeling
          - contextual_interpretation
          - action_selection_modeling
          - boundary_definition
          - semantic_conformance
      - id: C2
        name: governance_authority_risk
        description: Authority, Governance & Risk.
        importance: |
          Particularly important because delegated authority is
          central to meaningful agentic participation.
        includes:
          - authority_scope
          - permissions
          - constraints
          - policies
          - thresholds
          - escalation
          - revocation
          - auditability
          - risk_controls
          - regulatory_controls
          - segregation_of_duties
      - id: C3
        name: operational_realization
        description: Operational Realization.
        includes:
          - runtime_realization
          - agent_human_coordination
          - observability
          - exception_management
          - intervention
          - escalation
          - resilience
          - operational_ownership
          - service_management
          - incident_management
      - id: C4
        name: value_performance
        description: Value & Performance Management.
        builds_on: CR-VAS-005
        includes:
          - outcome_measurement
          - baseline_comparison
          - incremental_value
          - time_to_outcome
          - quality
          - throughput
          - cost
          - intervention
          - rework
          - risk_adjusted_value
          - attribution_confidence
      - id: C5
        name: learning_improvement
        description: Learning & Continuous Improvement.
        includes:
          - performance_analysis
          - exception_analysis
          - intervention_analysis
          - boundary_tuning
          - policy_refinement
          - action_selection_improvement
          - adaptation_analysis
          - controlled_experimentation
          - counterfactual_evaluation
          - conformance_revalidation
      - id: C6
        name: portfolio_scaling
        description: Portfolio Scaling & Enterprise Integration.
        includes:
          - reusable_patterns
          - shared_capabilities
          - portfolio_governance
          - cross_value_stream_coordination
          - enterprise_architecture_integration
          - capability_reuse
          - standards
          - common_measurement
          - investment_prioritization
          - lifecycle_management

  # ----------------------------------------------------------------
  # 7. Capability progression matrix
  # ----------------------------------------------------------------
  capability_progression_matrix:
    description: |
      Per-dimension level expectations. The matrix is normative
      guidance; an organization MAY deviate where evidence supports
      the deviation.
    rows:
      - dimension: C1_design_semantics
        per_level:
          L1: concepts_recognized
          L2: standard_defined
          L3: applied
          L4: optimized
          L5: enterprise_reusable
      - dimension: C2_governance_authority_risk
        per_level:
          L1: risks_recognized
          L2: authority_model_defined
          L3: operational_controls
          L4: continuously_monitored
          L5: enterprise_policy_framework
      - dimension: C3_operational_realization
        per_level:
          L1: potential_identified
          L2: operating_model_defined
          L3: production_operation
          L4: performance_managed
          L5: scaled_operation
      - dimension: C4_value_performance
        per_level:
          L1: benefits_hypothesized
          L2: metrics_defined
          L3: metrics_collected
          L4: value_managed
          L5: enterprise_value_portfolio
      - dimension: C5_learning_improvement
        per_level:
          L1: ad_hoc_learning
          L2: improvement_process_defined
          L3: improvements_executed
          L4: evidence_driven
          L5: continuous_adaptive_improvement
      - dimension: C6_portfolio_scaling
        per_level:
          L1: isolated_awareness
          L2: reference_patterns
          L3: multiple_implementations
          L4: portfolio_management
          L5: enterprise_capability

  # ----------------------------------------------------------------
  # 8. Maturity assessment principle
  # ----------------------------------------------------------------
  assessment_principle:
    formula: |
      Capability + Evidence + Operational Practice + Performance +
      Governance + Repeatability + Scale.
    statement: |
      Maturity SHALL NOT be determined by a simple count of
      technologies or features. A capability SHALL NOT be
      considered mature merely because documentation exists.

  # ----------------------------------------------------------------
  # 9. Evidence requirements by level
  # ----------------------------------------------------------------
  maturity_evidence:
    description: |
      The level of evidence required to support a maturity claim
      grows with each level.
    per_level:
      L1:
        - strategy_statements
        - awareness_material
        - identified_candidates
        - terminology
        - preliminary_assessments
      L2:
        - avs_models
        - qualification_assessments
        - authority_models
        - conformance_tests
        - governance_definitions
        - measurement_specifications
      L3:
        - production_instances
        - conformance_records
        - runtime_evidence
        - operational_metrics
        - intervention_records
        - authority_enforcement
        - outcome_evidence
      L4:
        - historical_performance
        - baselines
        - trend_analysis
        - value_attribution
        - risk_analysis
        - improvement_records
        - conformance_drift_analysis
      L5:
        - portfolio_level_measurements
        - reusable_patterns
        - enterprise_governance
        - cross_avs_analysis
        - scaling_evidence
        - continuous_improvement
        - capability_evolution_records

  # ----------------------------------------------------------------
  # 10. Multidimensional assessment rule
  # ----------------------------------------------------------------
  multidimensional_assessment:
    rule: |
      A single arithmetic average SHALL NOT be the default maturity
      mechanism. The profile SHALL remain visible with per-dimension
      levels and limiting dimensions called out.
    example_profile: |
      maturity:
        overall:
          level: L3
        dimensions:
          design: L5
          governance: L4
          operations: L3
          value: L2
          improvement: L2
          scaling: L1
        limiting_dimensions:
          - value
          - improvement
          - scaling

  # ----------------------------------------------------------------
  # 11. Overall maturity rule (minimum-required-dimension gate)
  # ----------------------------------------------------------------
  overall_maturity_rule:
    rule: |
      Overall Maturity = minimum of required capability dimensions,
      subject to level-specific gates. This prevents exceptional
      strength in one area from masking fundamental weakness
      elsewhere. For example: excellent AI engineering + weak
      authority governance + no outcome measurement SHALL NOT
      qualify as a highly mature AVS capability.
    aggregation: minimum_required_dimension

  # ----------------------------------------------------------------
  # 12. Mandatory gates
  # ----------------------------------------------------------------
  mandatory_gates:
    L2_gate:
      requires:
        - defined_avs_semantics
        - defined_qualification_approach
        - authority_model
        - evidence_model
        - measurement_model
        - governance_ownership
    L3_gate:
      requires:
        - at_least_one_conformant_production_avs
        - operational_authority_enforcement
        - operational_intervention_escalation
        - outcome_measurement
        - traceable_evidence
    L4_gate:
      requires:
        - repeatable_performance_management
        - baseline_comparison
        - value_measurement
        - risk_monitoring
        - conformance_drift_management
        - systematic_improvement
    L5_gate:
      requires:
        - multiple_operational_avs_implementations
        - portfolio_governance
        - reusable_capability_patterns
        - enterprise_measurement
        - demonstrated_scaling
        - continuous_capability_evolution

  # ----------------------------------------------------------------
  # 13. Anti-patterns
  # ----------------------------------------------------------------
  anti_patterns:
    description: |
      The following SHALL explicitly be rejected. None of these
      constitute evidence of AVS maturity.
    items:
      - id: maturity_equals_autonomy
        claim: Higher autonomy means higher maturity.
        rejected_because: |
          Higher autonomy is not inherently more mature. A mature AVS
          may deliberately retain human approval, escalation, and
          conservative authority limits.
      - id: maturity_equals_ai_sophistication
        claim: More advanced models mean higher AVS maturity.
        rejected_because: |
          AI model sophistication is an implementation technology
          characteristic, not an organizational capability assessment.
      - id: maturity_equals_agent_count
        claim: More agents means greater maturity.
        rejected_because: |
          Agent count is a portfolio size measure, not a capability
          measure. An organization with many poorly governed agents is
          LESS mature, not more.
      - id: maturity_equals_automation_percentage
        claim: More automated stages means higher maturity.
        rejected_because: |
          Automation percentage conflates automation with agenticity
          and conflates volume with quality of governance.
      - id: maturity_equals_intervention_reduction
        claim: Fewer human interventions automatically means higher
          maturity.
        rejected_because: |
          Intervention is a deliberate control mechanism, not a
          defect. Removing interventions solely to increase an
          automation score degrades risk and governance capability.
      - id: maturity_equals_cost_reduction
        claim: Lower operating cost automatically means higher
          maturity.
        rejected_because: |
          Cost reduction is a potential outcome, not a definition of
          organizational capability. Cost reduction without value or
          risk management is not maturity.
      - id: maturity_equals_production_deployment
        claim: A production deployment automatically constitutes
          mature AVS capability.
        rejected_because: |
          Production deployment without systematic measurement,
          governance, risk management, and improvement is L3
          implemented at best, not L4 managed or L5 scaled-adaptive.
      - id: maturity_equals_semantic_complexity
        claim: More relationships, agents, policies or semantic
          constructs imply greater maturity.
        rejected_because: |
          Semantic complexity is a vocabulary property, not a
          capability property. Maturity is about repeatable,
          evidence-based capability, not model cardinality.

  # ----------------------------------------------------------------
  # 14. Human participation in mature AVS
  # ----------------------------------------------------------------
  human_participation:
    principle: |
      Human participation SHALL remain a first-class design option at
      every maturity level. A mature implementation chooses the
      appropriate interaction pattern based on: risk, authority,
      materiality, regulation, reversibility, consequence,
      confidence, and customer impact.
    interaction_patterns:
      - agent_to_human_approval_to_action
      - agent_to_human_exception_handling_to_continue
      - human_decision_to_agent_execution
      - agent_decision_to_human_validation
      - human_and_agent_shared_progression
    invariant: |
      An AVS that uses mandatory human approvals for high-risk
      decisions while otherwise operating agentically SHALL NOT
      incur a maturity penalty solely because humans remain in the
      loop.

  # ----------------------------------------------------------------
  # 15. Maturity != full automation
  # ----------------------------------------------------------------
  full_automation_caveat:
    target_state: |
      Optimal delegation of value-realization decisions and actions
      within appropriate authority boundaries.
    not_target_state: Maximum delegation.
    rationale: |
      This distinction is foundational to the model. Higher autonomy
      is not inherently more mature. The objective is appropriate
      delegated value realization, not maximum delegation.

  # ----------------------------------------------------------------
  # 16. Capability lifecycle
  # ----------------------------------------------------------------
  capability_lifecycle:
    stages:
      - discover
      - qualify
      - design
      - conform
      - deploy
      - measure
      - improve
      - scale
      - reassess
    description: |
      The capability lifecycle is iterative. A change to: authority,
      decision logic, agentic scope, Value Stream structure, operating
      context, risk boundary, or material behavior MAY trigger
      revalidation.

  # ----------------------------------------------------------------
  # 17. Maturity transition criteria
  # ----------------------------------------------------------------
  transition_criteria:
    principle: |
      Progression between levels SHALL require demonstrated capability
      rather than elapsed time. There SHALL be no automatic
      progression based on age, deployment count, or technology
      adoption.
    transitions:
      - from: L2
        to: L3
        requires: actual_operational_realization
      - from: L3
        to: L4
        requires: demonstrated_management_of_performance_value_and_risk
      - from: L4
        to: L5
        requires: demonstrated_organizational_scaling_and_adaptive_capability

  # ----------------------------------------------------------------
  # 18. Maturity schema (machine-readable model declaration)
  # ----------------------------------------------------------------
  schema:
    model:
      id: AVS-MATURITY
      version: "1.0"
    declared_levels:
      - {id: L0, name: unaware}
      - {id: L1, name: aware}
      - {id: L2, name: defined}
      - {id: L3, name: implemented}
      - {id: L4, name: managed}
      - {id: L5, name: scaled-adaptive}
    declared_dimensions:
      - design_semantics
      - governance_authority_risk
      - operational_realization
      - value_performance
      - learning_improvement
      - portfolio_scaling
    assessment:
      method: gated_multidimensional
      aggregation: minimum_required_dimension
      evidence_required: true
      conformance_required_for: L3
    constraints:
      maturity_does_not_define_agenticity: true
      autonomy_not_required: true
      ai_not_required: true
      automation_not_required: true
      human_intervention_not_negative: true

  # ----------------------------------------------------------------
  # 19. Assessment record template
  # ----------------------------------------------------------------
  assessment_record:
    description: |
      A maturity assessment SHOULD be represented separately from the
      AVS semantic definition. The assessment is time-bound evidence,
      not a permanent organizational label.
    template: |
      maturity_assessment:
        id:
        subject:
          organization:
          portfolio:
          value_streams:
        model:
          version:
        assessment_period:
        dimensions:
          design_semantics:           {level, evidence, gaps}
          governance_authority_risk: {level, evidence, gaps}
          operational_realization:    {level, evidence, gaps}
          value_performance:          {level, evidence, gaps}
          learning_improvement:       {level, evidence, gaps}
          portfolio_scaling:          {level, evidence, gaps}
        overall:
          level:
          gating_result:
          limiting_dimensions:
        assessor:
        assessment_date:
        next_review:

  # ----------------------------------------------------------------
  # 20. Capability gap model
  # ----------------------------------------------------------------
  capability_gaps:
    principle: |
      The maturity assessment SHALL produce capability gaps, not
      merely a maturity score. This makes the model actionable.
    template: |
      gap:
        capability:
        current_level:
        target_level:
        gap_type: [...]
        priority:
        recommended_action: [...]

  # ----------------------------------------------------------------
  # 21. Improvement planning
  # ----------------------------------------------------------------
  improvement_planning:
    chain:
      - current_state
      - capability_gap
      - required_evidence
      - improvement_initiative
      - implementation
      - measurement
      - reassessment
    statement: |
      The chain connects naturally to enterprise architecture and
      transformation planning.

  # ----------------------------------------------------------------
  # 22. Enterprise architecture relationship
  # ----------------------------------------------------------------
  enterprise_architecture:
    informs:
      - business_architecture
      - operating_model_transformation
      - enterprise_architecture
      - ai_strategy
      - automation_strategy
      - workforce_transformation
      - governance
      - risk_management
      - technology_investment
      - data_and_knowledge_strategy
    scoping_constraint: |
      AVS maturity SHALL remain semantically scoped to Agentic Value
      Stream capability. It SHALL NOT become a generic enterprise
      digital maturity model.

  # ----------------------------------------------------------------
  # 23. Governance roles (organizational assignments, not ontology)
  # ----------------------------------------------------------------
  governance_roles:
    description: |
      These are governance roles, not semantic requirements of an
      Agentic Value Stream itself. They clarify accountability at the
      organizational level for maturity outcomes.
    items:
      - id: avs_capability_owner
        owns: organizational AVS capability
      - id: value_stream_owner
        owns: value stream outcomes
      - id: agentic_solution_owner
        owns: implementation of agentic participation
      - id: risk_governance_owner
        owns: authority, risk and policy controls
      - id: semantic_steward
        owns: semantic consistency and conformance interpretation
      - id: measurement_value_owner
        owns: performance and value measurement

  # ----------------------------------------------------------------
  # 24. Assessment frequency
  # ----------------------------------------------------------------
  assessment_frequency:
    triggers:
      - periodic
      - major_architectural_change
      - material_authority_change
      - significant_agentic_scope_change
      - major_incident
      - significant_regulatory_change
      - expansion_to_new_value_streams
      - material_performance_deterioration
    principle: |
      Maturity status is time-bound evidence, not a permanent
      organizational label.

  # ----------------------------------------------------------------
  # 25. Maturity drift (regression support)
  # ----------------------------------------------------------------
  drift:
    principle: |
      An organization MAY regress. The model MUST support regression.
      Maturity SHALL NOT be treated as an irreversible progression.
    example:
      from: L4
      to: L3
      causes:
        - major_platform_migration
        - measurement_gaps
        - authority_monitoring_degraded

  # ----------------------------------------------------------------
  # 26. Invariants (12)
  # ----------------------------------------------------------------
  invariants:
    description: |
      CR-VAS-006 introduces the following normative invariants. Each
      invariant is binding across maturity assessments, dashboards,
      and reporting.
    items:
      - id: AVS-MAT-INV-001
        statement: Maturity does not define AVS semantic qualification.
      - id: AVS-MAT-INV-002
        statement: Conformance precedes L3 production maturity.
      - id: AVS-MAT-INV-003
        statement: AI is not required for maturity.
      - id: AVS-MAT-INV-004
        statement: Autonomy is not required for maturity.
      - id: AVS-MAT-INV-005
        statement: Human intervention is not inherently a maturity defect.
      - id: AVS-MAT-INV-006
        statement: Agent count does not determine maturity.
      - id: AVS-MAT-INV-007
        statement: Technology sophistication does not determine maturity.
      - id: AVS-MAT-INV-008
        statement: Maturity shall be evidence-based.
      - id: AVS-MAT-INV-009
        statement: Maturity shall support regression.
      - id: AVS-MAT-INV-010
        statement: |
          Overall maturity shall not conceal mandatory capability
          deficiencies.
      - id: AVS-MAT-INV-011
        statement: |
          Maturity measures organizational capability, not merely
          individual AVS performance.
      - id: AVS-MAT-INV-012
        statement: |
          Operational performance does not automatically establish
          organizational maturity.

  # ----------------------------------------------------------------
  # 27. Boundary assertions
  # ----------------------------------------------------------------
  boundary_assertions:
    per_cr_vas_006_maturity_capability: |
      Per CR-VAS-006, maturity SHALL be separated from semantic
      qualification (CR-VAS-002), conformance (CR-VAS-004), and
      measurement (CR-VAS-005). AI adoption, agent count, autonomy
      percentage, model sophistication, and operational scale SHALL
      NOT establish maturity on their own. Maturity SHALL support
      regression. Overall maturity SHALL NOT conceal mandatory
      capability deficiencies.


# === Governance, Lifecycle & Portfolio (CR-VAS-007) ===
#
# Per CR-VAS-007 (Agentic Value Stream Governance, Lifecycle &
# Portfolio Management): Adds the `governance:` block formalising:
#   (1) the governance principle (Value Stream + Agentic Participation
#       + Authority + Risk + Outcome -> Governance, NOT AI Model ->
#       Agent -> Agentic System -> Governance),
#   (2) governance objective (semantic integrity, authority integrity,
#       operational integrity, risk/policy integrity, value integrity,
#       lifecycle integrity),
#   (3) governance object model (governance subordinate to semantic
#       boundary; Lifecycle + Controls + Portfolio),
#   (4) the lifecycle model with 10 states (Proposed, Assessed,
#       Designed, Qualified, Approved, Implemented, Operational,
#       Managed, Suspended, Retired),
#   (5) lifecycle state vocabulary with full definitions,
#   (6) governance state vs lifecycle state separation,
#   (7) seven governance domains (G1 Semantic, G2 Authority, G3
#       Operational, G4 Risk/Policy, G5 Value, G6 Change, G7
#       Portfolio),
#   (8) material change concept + materiality assessment,
#   (9) change classification (Class A Non-Material, Class B
#       Controlled, Class C Material, Class D Critical),
#   (10) change decision model,
#   (11) authority governance (record schema, escalation, revocation),
#   (12) fallback governance (Agentic -> Human / Deterministic /
#       Manual / Safe Stop),
#   (13) intervention governance (8 intervention types),
#   (14) conformance drift (lifecycle revalidation),
#   (15) governance triggers (event-driven revalidation),
#   (16) governance evidence (governance_decision record schema),
#   (17) governance decision types (15 controlled verbs),
#   (18) portfolio governance (inventory, prioritization, capability
#        reuse, agent sprawl avoidance, concentration risk),
#   (19) lifecycle ownership (8 ownership archetypes),
#   (20) governance RACI principle (organisational, not ontology),
#   (21) governance policy hierarchy (Enterprise -> Domain -> Value
#        Stream -> AVS -> Authority Boundary -> Runtime Enforcement),
#   (22) runtime instruction vs governance policy distinction
#        (Instruction != Policy != Authority != Governance Decision),
#   (23) emergency controls,
#   (24) governance dashboard (lifecycle / semantic / authority / risk
#        / value / maturity views),
#   (25) governance metrics (review timeliness, revalidation
#        compliance, authority control coverage, exception rate,
#        suspension response time, remediation closure rate),
#   (26) governance maturity vs AVS maturity distinction,
#   (27) lifecycle schema (machine-readable),
#   (28) change record schema (machine-readable),
#   (29) portfolio record schema (machine-readable),
#   (30) 15 normative invariants (AVS-GOV-INV-001..015),
#   (31) positive + negative governance tests (10 + 10 boundary = 30),
#   (32) governance documentation set (8 docs), and
#   (33) separation principle: governance does NOT redefine AVS
#        semantics.
#
# Cardinal author rule: Emmanuel A. Otchere <emmanuel@otchere.com>
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-10-08)
# Last revised: 2026-10-08 (CR-VAS-007 governance block landed)

governance:

  specializes: ES:CONCEPT:agentic-value-stream

  # ----------------------------------------------------------------
  # 1. Principle
  # ----------------------------------------------------------------
  principle: |
    An Agentic Value Stream is governed as a Value Stream with
    agentic participation, NOT as an autonomous technology asset.
    Governance therefore begins with:

      Value Stream
        -> Agentic Participation
          -> Authority
            -> Risk
              -> Outcome
                -> Governance

    rather than:

      AI Model
        -> Agent
          -> Agentic System
            -> Governance

    The latter incorrectly makes technology the primary governance
    object. CR-VAS-007 establishes the management control plane
    around an already-defined semantic object.

  # ----------------------------------------------------------------
  # 2. Governance objective
  # ----------------------------------------------------------------
  governance_objective: |
    Ensure that delegated agentic participation remains semantically
    valid, appropriately authorized, operationally controlled,
    outcome-oriented, measurable, and aligned with enterprise intent
    throughout its lifecycle.

  # ----------------------------------------------------------------
  # 3. Governance dimensions
  # ----------------------------------------------------------------
  dimensions:
    description: |
      Governance covers six dimensions.
    items:
      - semantic_integrity
      - authority_integrity
      - operational_integrity
      - risk_and_policy_integrity
      - value_integrity
      - lifecycle_integrity

  # ----------------------------------------------------------------
  # 4. Governance object model
  # ----------------------------------------------------------------
  object_model:
    description: |
      Governance MUST remain subordinate to the semantic model.
    semantic_boundary:
      - value_stream_identity
      - agentic_participation
      - qualification
      - semantic_boundary
      - conformance
      - ontology_alignment
    authority_boundary:
      - authority_scope
      - bounded_authority
    outcome_boundary:
      - value_realization
      - outcome_progression
    governance_outputs:
      - lifecycle
      - controls
      - portfolio

  # ----------------------------------------------------------------
  # 5. Lifecycle model
  # ----------------------------------------------------------------
  lifecycle:
    description: |
      An AVS SHALL have an explicit lifecycle. The lifecycle is NOT
      necessarily linear. An AVS may move backwards (Operational ->
      Suspended -> Revalidated -> Operational, or Operational ->
      Material Change -> Reassessment -> Non-Conformant ->
      Remediation).
    states:
      - id: proposed
        name: Proposed
        meaning: |
          The Value Stream has been identified as a candidate for
          agentic realization. No claim of AVS conformance has yet
          been established.
      - id: assessed
        name: Assessed
        meaning: |
          The candidate has undergone initial evaluation covering
          Value Stream relevance, candidate agentic participation,
          expected outcomes, potential authority, risk, materiality,
          feasibility.
      - id: designed
        name: Designed
        meaning: |
          The intended realization has been formally designed
          including participation scope, intent, authority,
          contextual inputs, action space, intervention,
          escalation, expected outcomes, measurement, governance.
      - id: qualified
        name: Qualified
        meaning: |
          The implementation/design has satisfied the applicable AVS
          semantic qualification and evidence requirements
          established through CR-VAS-002 and CR-VAS-004.
          Qualification is a semantic state, NOT a technology
          approval.
      - id: approved
        name: Approved
        meaning: |
          The relevant governance authority has authorized
          implementation or operation within the defined boundary.
          Approval SHALL NOT be interpreted as semantic
          qualification.
      - id: implemented
        name: Implemented
        meaning: |
          The AVS realization exists technically and operationally
          but may not yet be operating as a production service.
      - id: operational
        name: Operational
        meaning: |
          The AVS is actively realizing value in its intended
          operational environment. Required controls must be active.
      - id: managed
        name: Managed
        meaning: |
          The AVS is operational and subject to systematic
          measurement, monitoring, risk management, value
          management, conformance management, improvement. Aligns
          with the operational capability described in CR-VAS-006.
      - id: suspended
        name: Suspended
        meaning: |
          The AVS has temporarily ceased agentic realization.
          Triggers may include material policy violation, authority
          breach, unacceptable risk, conformance failure, severe
          operational incident, unexplained outcome degradation,
          loss of required evidence, regulatory requirement.
          Suspension SHOULD preserve the Value Stream itself where
          possible.
      - id: retired
        name: Retired
        meaning: |
          The AVS implementation is no longer authorized for
          operational use. Retirement SHOULD preserve historical
          evidence, measurement history, governance decisions,
          lessons learned, relevant provenance.

  # ----------------------------------------------------------------
  # 6. Governance state vs lifecycle state
  # ----------------------------------------------------------------
  state_separation:
    description: |
      Lifecycle state and governance status SHALL remain distinct.
      An AVS may be operational while subject to remediation,
      heightened monitoring, conditional approval, restricted
      authority. This prevents state explosion.
    example_operational_conditional: |
      lifecycle:
        state: operational
      governance:
        status: conditional
    example_suspended_remediation: |
      lifecycle:
        state: suspended
      governance:
        status: remediation

  # ----------------------------------------------------------------
  # 7. Governance domains (G1..G7)
  # ----------------------------------------------------------------
  domains:
    description: |
      CR-VAS-007 establishes seven governance domains.
    items:
      - id: G1
        name: semantic_governance
        controls:
          - value_stream_identity
          - agentic_participation
          - qualification
          - semantic_boundary
          - conformance
          - ontology_alignment
      - id: G2
        name: authority_governance
        controls:
          - authority_scope
          - permissions
          - thresholds
          - policies
          - escalation
          - revocation
          - temporal_limits
          - transaction_limits
          - risk_limits
      - id: G3
        name: operational_governance
        controls:
          - reliability
          - observability
          - incident_management
          - intervention
          - escalation
          - service_ownership
          - fallback_mechanisms
      - id: G4
        name: risk_and_policy_governance
        controls:
          - regulatory_requirements
          - organizational_policy
          - safety_constraints
          - security
          - privacy
          - financial_limits
          - reputational_risk
          - model_system_risks
      - id: G5
        name: value_governance
        controls:
          - value_baseline
          - outcome_realization
          - benefit_realization
          - cost
          - risk_adjusted_value
          - customer_stakeholder_outcomes
      - id: G6
        name: change_governance
        controls:
          - semantic_changes
          - authority_changes
          - agentic_scope_changes
          - policy_changes
          - operating_context_changes
          - major_technology_changes
      - id: G7
        name: portfolio_governance
        controls:
          - prioritization
          - duplication
          - reuse
          - dependencies
          - investment
          - risk_concentration
          - capability_reuse
          - retirement

  # ----------------------------------------------------------------
  # 8. Material change
  # ----------------------------------------------------------------
  material_change:
    description: |
      A central requirement of CR-VAS-007 is the concept of a
      Material AVS Change. A change is material when it could alter
      whether the implementation remains semantically Agentic,
      delegated authority, action space, risk exposure, stakeholder
      outcome, Value Stream progression, intervention requirements,
      regulatory obligations, or operational boundary.
    examples:
      - change_agent_model
      - change_authority_threshold
      - change_decision_policy
      - expand_action_space
      - advisory_to_delegated_execution
      - add_value_stream_stage
      - remove_human_approval
      - expand_geography
      - change_customer_population
      - change_regulatory_context
    principle: |
      These SHOULD trigger revalidation.

  # ----------------------------------------------------------------
  # 9. Change classification
  # ----------------------------------------------------------------
  change_classification:
    description: |
      Changes are classified by materiality and required revalidation.
    items:
      - id: class_a
        name: non_material
        meaning: |
          No meaningful effect on semantic qualification, authority,
          risk, or value realization. No full requalification
          required.
      - id: class_b
        name: controlled
        meaning: |
          Potential operational or measurement impact. Requires
          targeted review.
      - id: class_c
        name: material
        meaning: |
          Potential impact on semantic qualification, authority,
          risk or outcome. Requires formal revalidation.
      - id: class_d
        name: critical
        meaning: |
          Potential significant safety, regulatory, financial,
          customer or enterprise impact. Requires governance
          approval before implementation.

  # ----------------------------------------------------------------
  # 10. Change decision model
  # ----------------------------------------------------------------
  change_decision_model:
    flow: |
      Change Proposed -> Materiality Assessment -> (No: Controlled
      Change | Yes: Revalidation -> Approval -> Implementation ->
      Evidence -> Monitoring).

  # ----------------------------------------------------------------
  # 11. Authority governance
  # ----------------------------------------------------------------
  authority_governance:
    description: |
      Because bounded authority is a core AVS semantic condition,
      authority SHALL be governed throughout the lifecycle.
      Authority should be treated as a governed enterprise resource,
      NOT merely a prompt or configuration parameter.
    record_schema:
      fields:
        - id
        - scope
        - actor
        - permissions
        - constraints
        - policies
        - thresholds
        - temporal_boundary
        - transaction_boundary
        - escalation_conditions
        - revocation_conditions
        - approval
        - effective_from
        - effective_until

    escalation:
      description: |
        The governance model SHALL support escalation. Escalation
        SHOULD be explicit and observable.
      normal_case: |
        Agent acts within authority -> outcome progression.
      exceptional_case: |
        Authority threshold exceeded -> human / higher-authority
        actor -> decision -> agent continues or terminates.

    revocation:
      description: |
        Governance SHALL support immediate or scheduled revocation of
        delegated authority. Revocation MUST NOT require semantic
        deletion of the AVS.
      triggers:
        - incident
        - policy_change
        - regulatory_change
        - abnormal_behavior
        - authority_misuse
        - material_performance_degradation
        - security_event
        - loss_of_required_evidence

  # ----------------------------------------------------------------
  # 12. Fallback governance
  # ----------------------------------------------------------------
  fallback_governance:
    description: |
      Every production AVS SHOULD define an appropriate fallback
      strategy. Fallback SHALL be determined by Value Stream
      criticality and risk. Fallback behavior SHOULD itself be
      tested.
    patterns:
      - agentic_to_human
      - agentic_to_deterministic_automation
      - agentic_to_manual_process
      - agentic_to_safe_stop

  # ----------------------------------------------------------------
  # 13. Intervention governance
  # ----------------------------------------------------------------
  intervention_governance:
    description: |
      Human intervention SHALL be governed as an explicit control
      mechanism. Intervention SHALL NOT automatically be classified
      as failure. The governance question is: is the intervention
      pattern appropriate for the delegated authority and risk of
      the Value Stream?
    types:
      - approval
      - validation
      - exception_handling
      - correction
      - escalation
      - override
      - investigation
      - recovery

  # ----------------------------------------------------------------
  # 14. Conformance drift
  # ----------------------------------------------------------------
  conformance_drift:
    description: |
      An AVS may gradually cease to conform even if its original
      implementation was valid. Conformance is a lifecycle property,
      NOT a one-time certification event. Periodic and event-
      triggered revalidation SHALL be supported.
    causes:
      - context_changes
      - authority_expansion
      - policy_changes
      - new_action_options
      - value_stream_changes
      - agent_behavior_changes
      - customer_population_changes
      - regulatory_changes

  # ----------------------------------------------------------------
  # 15. Governance triggers
  # ----------------------------------------------------------------
  governance_triggers:
    description: |
      Revalidation SHOULD be triggered by material events. This
      provides an event-driven governance model rather than relying
      exclusively on annual reviews.
    items:
      - semantic_change
      - authority_change
      - risk_change
      - policy_change
      - material_outcome_change
      - agentic_scope_change
      - value_stream_change
      - regulatory_change
      - major_incident
      - conformance_drift
      - architecture_change

  # ----------------------------------------------------------------
  # 16. Governance evidence
  # ----------------------------------------------------------------
  governance_evidence:
    description: |
      Each governance decision should have traceable evidence.
      Governance decisions MUST be distinguishable from semantic
      evidence.
    record_schema:
      fields:
        - id
        - subject
        - decision
        - rationale
        - authority
        - evidence
        - risks
        - conditions
        - effective_from
        - effective_until
        - decided_by
        - reviewed_by
        - review_date

  # ----------------------------------------------------------------
  # 17. Governance decision types
  # ----------------------------------------------------------------
  governance_decision_types:
    description: |
      Recommended controlled vocabulary for governance decisions.
    controlled_vocabulary:
      - qualify
      - approve
      - approve_with_conditions
      - reject
      - deploy
      - continue
      - restrict
      - escalate
      - suspend
      - resume
      - revalidate
      - expand
      - reduce_scope
      - revoke_authority
      - retire

  # ----------------------------------------------------------------
  # 18. Portfolio governance
  # ----------------------------------------------------------------
  portfolio_governance:
    description: |
      At enterprise scale, governance moves beyond individual AVS
      instances.
    inventory:
      - avs_inventory
      - business_domains
      - value_streams
      - agentic_scope
      - authority_concentration
      - criticality
      - risk
      - value
      - maturity
      - technology_dependencies
      - shared_capabilities
      - duplication
      - lifecycle_state

    prioritization:
      description: |
        Portfolio decisions SHOULD consider expected value, strategic
        alignment, feasibility, risk, capability readiness, reuse
        potential, and operational criticality. A simple "highest
        automation opportunity first" strategy is explicitly
        rejected.
      factors:
        - expected_value
        - strategic_alignment
        - feasibility
        - risk
        - capability_readiness
        - reuse_potential
        - operational_criticality

    capability_reuse:
      description: |
        Portfolio governance SHOULD identify reusable capabilities.
        This prevents each AVS from independently rebuilding
        enterprise control capabilities.
      reusable_capabilities:
        - identity
        - authorization
        - policy_enforcement
        - knowledge_retrieval
        - decision_services
        - monitoring
        - evaluation
        - intervention
        - audit
        - measurement
        - orchestration

    agent_sprawl:
      description: |
        Portfolio governance SHOULD explicitly monitor for
        unnecessary complexity. The goal is NOT to minimize the
        number of agents; the goal is to minimize unnecessary
        complexity while maximizing reusable value-realization
        capability.
      monitor_for:
        - duplicate_agents
        - duplicate_capabilities
        - inconsistent_authority_models
        - fragmented_policies
        - overlapping_value_streams
        - redundant_ai_services
        - unnecessary_multi_agent_architectures

    concentration_risk:
      description: |
        An enterprise SHOULD identify concentration risks such as
        many AVS sharing the same authority service, policy engine,
        agent platform -> single failure or control point. Portfolio
        governance SHOULD therefore consider systemic dependencies.

  # ----------------------------------------------------------------
  # 19. Lifecycle ownership
  # ----------------------------------------------------------------
  lifecycle_ownership:
    description: |
      Every operational AVS SHOULD have explicit ownership. These
      may be combined in smaller organizations but MUST be
      conceptually distinguishable.
    responsibility_to_owner:
      - responsibility: value_outcome
        owner: value_stream_owner
      - responsibility: semantic_integrity
        owner: semantic_steward
      - responsibility: agentic_realization
        owner: avs_solution_owner
      - responsibility: authority
        owner: authority_owner
      - responsibility: risk
        owner: risk_governance_owner
      - responsibility: operations
        owner: operational_owner
      - responsibility: measurement
        owner: value_measurement_owner
      - responsibility: lifecycle
        owner: avs_lifecycle_owner

  # ----------------------------------------------------------------
  # 20. Governance RACI principle
  # ----------------------------------------------------------------
  raci_principle:
    description: |
      The repository SHOULD avoid embedding a universal RACI matrix
      into the semantic concept. RACI belongs to organizational
      governance configuration. The semantic model should instead
      define required responsibilities, while individual enterprises
      determine their organizational assignment.

  # ----------------------------------------------------------------
  # 21. Governance policy hierarchy
  # ----------------------------------------------------------------
  policy_hierarchy:
    description: |
      Policies are structured to prevent runtime agent instructions
      from becoming the highest authority.
    chain:
      - enterprise_policy
      - domain_policy
      - value_stream_policy
      - avs_policy
      - authority_boundary
      - runtime_enforcement

  # ----------------------------------------------------------------
  # 22. Runtime instruction vs governance policy
  # ----------------------------------------------------------------
  runtime_vs_governance:
    description: |
      The following distinction is mandatory: Instruction != Policy
      != Authority != Governance Decision. An agent instruction
      cannot legitimately override a higher-order authority
      constraint.

  # ----------------------------------------------------------------
  # 23. Emergency controls
  # ----------------------------------------------------------------
  emergency_controls:
    description: |
      Critical AVS implementations SHOULD provide emergency controls
      that operate independently enough to remain effective when
      the AVS itself is malfunctioning.
    items:
      - emergency_suspension
      - authority_revocation
      - safe_fallback
      - escalation
      - incident_capture
      - evidence_preservation
      - controlled_restart

  # ----------------------------------------------------------------
  # 24. Governance dashboard
  # ----------------------------------------------------------------
  governance_dashboard:
    description: |
      A portfolio governance dashboard should expose lifecycle,
      semantic, authority, risk, value, and maturity views.
    lifecycle_view:
      - proposed
      - assessed
      - designed
      - qualified
      - approved
      - operational
      - suspended
      - retired
    semantic_view:
      - conformance_status
      - drift
      - qualification_age
    authority_view:
      - authority_utilization
      - exceptions
      - revocations
      - escalation
    risk_view:
      - incidents
      - boundary_violations
      - policy_exceptions
    value_view:
      - outcome_realization
      - incremental_value
      - cost
      - risk_adjusted_value
    maturity_view:
      - capability_profile
      - gaps
      - improvement_trajectory

  # ----------------------------------------------------------------
  # 25. Governance metrics
  # ----------------------------------------------------------------
  governance_metrics:
    description: |
      CR-VAS-007 introduces governance-specific measures that
      complement (do NOT replace) CR-VAS-005 measurement metrics.
    items:
      - id: governance_review_timeliness
        formula: "reviews_completed_within_required_period / reviews_due"
      - id: revalidation_compliance
        formula: "material_changes_revalidated / material_changes"
      - id: authority_control_coverage
        formula: "agentic_authority_boundaries_with_active_controls / total_delegated_authority_boundaries"
      - id: governance_exception_rate
        formula: "governance_exceptions / governed_avs_events"
      - id: suspension_response_time
        description: Time from critical governance trigger to
          effective suspension.
      - id: remediation_closure_rate
        formula: "closed_governance_findings / open_governance_findings"

  # ----------------------------------------------------------------
  # 26. Governance maturity vs AVS maturity
  # ----------------------------------------------------------------
  governance_vs_avs_maturity:
    description: |
      CR-VAS-006 measures organizational capability. CR-VAS-007
      governs the actual lifecycle. Therefore: Maturity = Capability
      to govern. Governance = Actual exercise of governance. A
      highly mature organization can still make a poor governance
      decision. Conversely, a smaller organization may operate a
      very disciplined governance process for a critical AVS.

  # ----------------------------------------------------------------
  # 27. Lifecycle schema
  # ----------------------------------------------------------------
  lifecycle_schema:
    description: |
      Machine-readable lifecycle record.
    fields:
      - state
      - state_since
      - owner
      - previous_state
      - transition_reason
      - governance.status
      - governance.approval
      - governance.conditions
      - qualification.status
      - qualification.last_validated
      - qualification.next_review
      - conformance.status
      - conformance.last_assessed
      - material_change.pending
      - suspension.active

  # ----------------------------------------------------------------
  # 28. Change record schema
  # ----------------------------------------------------------------
  change_record_schema:
    fields:
      - id
      - avs
      - classification
      - description
      - affected_scope
      - affected_authority
      - affected_risk
      - affected_outcomes
      - materiality.determination
      - materiality.rationale
      - revalidation.required
      - revalidation.status
      - approval.required
      - approval.status
      - implementation.status
      - post_change_validation.status
      - post_change_validation.evidence

  # ----------------------------------------------------------------
  # 29. Portfolio record schema
  # ----------------------------------------------------------------
  portfolio_record_schema:
    fields:
      - id
      - name
      - members[].avs_id
      - governance.owner
      - governance.review_cycle
      - dependencies[].type
      - dependencies[].subject
      - shared_capabilities[].capability
      - risk_profile.criticality
      - risk_profile.concentration
      - value.aggregate
      - value.confidence

  # ----------------------------------------------------------------
  # 30. Invariants (15)
  # ----------------------------------------------------------------
  invariants:
    description: |
      CR-VAS-007 introduces the following invariants. Each is
      binding across governance decisions, dashboards, and reporting.
    items:
      - id: AVS-GOV-INV-001
        statement: Governance does not redefine AVS semantics.
      - id: AVS-GOV-INV-002
        statement: |
          Semantic qualification and governance approval are distinct
          decisions.
      - id: AVS-GOV-INV-003
        statement: Operational status does not imply continuing
          conformance.
      - id: AVS-GOV-INV-004
        statement: Material changes require appropriate revalidation.
      - id: AVS-GOV-INV-005
        statement: Delegated authority must remain bounded and
          governable.
      - id: AVS-GOV-INV-006
        statement: Authority must be revocable.
      - id: AVS-GOV-INV-007
        statement: Production AVS should have an appropriate
          fallback strategy.
      - id: AVS-GOV-INV-008
        statement: Human intervention may be a deliberate governance
          control.
      - id: AVS-GOV-INV-009
        statement: Lifecycle states must support suspension and
          resumption.
      - id: AVS-GOV-INV-010
        statement: Lifecycle states must support retirement.
      - id: AVS-GOV-INV-011
        statement: Governance decisions require traceable evidence.
      - id: AVS-GOV-INV-012
        statement: |
          Portfolio governance must not redefine individual AVS
          semantics.
      - id: AVS-GOV-INV-013
        statement: |
          Runtime instructions cannot supersede governing authority
          or policy.
      - id: AVS-GOV-INV-014
        statement: Conformance is subject to lifecycle revalidation.
      - id: AVS-GOV-INV-015
        statement: |
          Governance responsibilities are organizational assignments,
          not ontology requirements.

  # ----------------------------------------------------------------
  # 31. Boundary assertions
  # ----------------------------------------------------------------
  boundary_assertions:
    per_cr_vas_007_governance_lifecycle: |
      Per CR-VAS-007, governance SHALL be the management control
      plane around an already-defined AVS semantic object. Governance
      SHALL NOT redefine AVS semantics. Material changes SHALL
      trigger revalidation. Authority SHALL be revocable. Runtime
      instructions SHALL NOT supersede governing authority or
      policy. Governance decisions SHALL be traceable.


# === Architecture Patterns & Reference Architectures (CR-VAS-008) ===
#
# Per CR-VAS-008 (Agentic Value Stream Architecture Patterns &
# Reference Architectures): Adds the `architecture:` block
# formalising:
#   (1) the architecture principle (architecture realizes AVS
#       semantics; it does NOT define them),
#   (2) six architectural planes (P1 Value & Outcome, P2 Value
#       Stream Realization, P3 Agentic Participation, P4 Control &
#       Governance, P5 Knowledge & Context, P6 Technology &
#       Integration),
#   (3) the canonical architecture pattern (Value Stream -> Agentic
#       Participation -> Intent/Context/Authority -> Decision ->
#       Action -> Outcome, surrounded by Governance),
#   (4) twelve reusable architecture patterns (AP-01..AP-12),
#   (5) four architectural boundaries (Value, Agentic, Authority,
#       Technology),
#   (6) the architecture decision record model,
#   (7) architecture quality attributes (12),
#   (8) architecture reference selection criteria,
#   (9) six architecture anti-patterns (AP-A01..A06),
#   (10) the technology-neutrality principle,
#   (11) six normative invariants (AVS-ARCH-INV-001..006), and
#   (12) 18 architecture tests (6 positive + 6 negative + 6 boundary
#        = 169 total kit coverage).
#
# Cardinal author rule: Emmanuel A. Otchere <emmanuel@otchere.com>
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-10-08)
# Last revised: 2026-10-08 (CR-VAS-008 architecture block landed)

architecture:

  specializes: ES:CONCEPT:agentic-value-stream

  # ----------------------------------------------------------------
  # 1. Core Principle
  # ----------------------------------------------------------------
  principle: |
    Architecture realizes Agentic Value Stream semantics; it does
    NOT define them.

    Therefore:

      AVS Semantics
        -> Participation Model
          -> Governance & Authority
            -> Architecture Pattern
              -> Technology Realization

    NOT:

      Technology Platform
        -> Agent Architecture
          -> "Agentic Value Stream"

    The latter reverses the semantic dependency.

  # ----------------------------------------------------------------
  # 2. Normative question
  # ----------------------------------------------------------------
  normative_question: |
    How can Agentic Value Streams be architected in different
    realization patterns while preserving the same underlying
    semantics?

  # ----------------------------------------------------------------
  # 3. Architecture scope (covered) and not covered (out of scope)
  # ----------------------------------------------------------------
  scope:
    covers:
      - reference_architectures
      - realization_patterns
      - agent_placement
      - human_agent_interaction
      - decision_placement
      - orchestration
      - knowledge_context_access
      - policy_enforcement
      - authority_enforcement
      - observability
      - measurement
      - fallback
      - multi_agent_coordination
      - integration_boundaries
    does_not_prescribe:
      - particular_ai_model
      - agent_framework
      - cloud_provider
      - orchestration_platform
      - programming_language
      - workflow_product
      - model_architecture
      - vendor

  # ----------------------------------------------------------------
  # 4. Architectural principle (Value Stream as primary object)
  # ----------------------------------------------------------------
  primary_object:
    description: |
      The primary architectural object remains the Value Stream
      realization. Agentic components are positioned according to
      where delegated decision/action capability is required.
    example: |
      Value Stream
        +-- Value Stage A
        |     +-- Human
        +-- Value Stage B
        |     +-- Agentic Participation
        +-- Value Stage C
        |     +-- Automation
        +-- Value Stage D
              +-- Human + Agent
    principle: |
      A Value Stream can therefore be heterogeneous.

  # ----------------------------------------------------------------
  # 5. Architectural planes (P1..P6)
  # ----------------------------------------------------------------
  planes:
    description: |
      The canonical AVS reference architecture uses six
      architectural planes. This layering deliberately keeps
      technology at the bottom of the semantic dependency chain.
    items:
      - id: P1
        name: value_and_outcome_plane
        description: Value & Outcome Plane.
        represents:
          - stakeholder
          - outcome
          - value
          - value_stream
          - value_realization
          - outcome_measures
        note: This is the business anchor.
      - id: P2
        name: value_stream_realization_plane
        description: Value Stream Realization Plane.
        represents:
          - value_stages
          - progression
          - decisions
          - actions
          - handoffs
          - dependencies
          - realization_boundaries
        principle: |
          Agentic participation is positioned here rather than
          creating a parallel "agentic process."
      - id: P3
        name: agentic_participation_plane
        description: Agentic Participation Plane.
        represents:
          - actor
          - entrusted_intent
          - contextual_interpretation
          - action_selection
          - progression
          - coordination
          - intervention
        principle: |
          This plane implements the semantics established in
          CR-VAS-003.
      - id: P4
        name: control_and_governance_plane
        description: Control & Governance Plane.
        represents:
          - authority
          - policy
          - constraints
          - risk
          - approval
          - escalation
          - intervention
          - revocation
          - audit
          - governance
      - id: P5
        name: knowledge_and_context_plane
        description: Knowledge & Context Plane.
        represents:
          - enterprise_data
          - knowledge
          - business_state
          - customer_context
          - external_signals
          - policies
          - historical_information
        principle: |
          The architecture MUST distinguish access to context from
          interpretation of context.
      - id: P6
        name: technology_and_integration_plane
        description: Technology & Integration Plane.
        represents:
          - applications
          - apis
          - services
          - agent_runtimes
          - models
          - workflow_systems
          - automation
          - event_infrastructure
          - data_platforms
        principle: |
          Technology is realization infrastructure, not AVS
          semantics.

  # ----------------------------------------------------------------
  # 6. Canonical architecture pattern
  # ----------------------------------------------------------------
  canonical_pattern:
    description: |
      The default pattern is Value Stream -> Agentic Participation
      -> Intent / Context / Authority -> Decision / Selection ->
      Action -> Value Outcome. Governance surrounds the entire
      realization.
    diagram: |
      Value Stream
        |
        v
      Agentic Participation
        |
      +---+----+
      v   v    v
      Intent Context Authority
        |
        v
      Decision / Selection
        |
        v
      Action
        |
        v
      Value Outcome
    governance_surround: |
      Governance surrounds the entire realization:
        Policy + Authority + Risk + Intervention + Audit
      around: Value Stream -> Agentic Participation -> Outcome
      grounded in: Technology

  # ----------------------------------------------------------------
  # 7. Architecture patterns (12)
  # ----------------------------------------------------------------
  patterns:
    description: |
      Twelve reusable architecture patterns.
    items:
      - id: AP-01
        name: agentic_stage_participation
        description: Agentic Stage Participation.
        shape: |
          Stage A -> [Agentic Stage Participation] -> Stage C.
        use_when:
          - only_one_stage_requires_contextual_decisions
          - other_stages_remain_human_or_automated
          - localized_delegation_is_preferable
        warning: |
          This is NOT an "Agentic Value Stage" semantic type.
      - id: AP-02
        name: agentic_decision
        description: Agentic Decision.
        shape: |
          Context -> Agentic Decision -> Selected Path -> Value
          Stream Progression.
        examples:
          - case_routing
          - eligibility_determination
          - treatment_of_an_exception
          - prioritization
          - resource_allocation
        requirement: |
          The architecture must demonstrate that the decision
          affects Value Stream progression.
      - id: AP-03
        name: agentic_execution
        description: Agentic Execution.
        shape: |
          Intent -> Context -> Action Selection -> Execution.
        note: |
          The agent may select among permissible execution
          alternatives.
      - id: AP-04
        name: human_agent_hybrid
        description: Human-Agent Hybrid.
        shape_primary: |
          Human Intent -> Agent Interpretation -> Agent
          Recommendation / Selection -> Human Decision -> Agent
          Execution.
        shape_alternative: |
          Agent -> Exception -> Human -> Resolution -> Agent.
        note: |
          This is a first-class AVS architecture pattern.
      - id: AP-05
        name: agent_to_human_escalation
        description: Agent-to-Human Escalation.
        shape: |
          Agent -> Within Authority?
            -> YES: Continue
            -> NO: Escalate -> Human.
        requirement: |
          The escalation threshold must be explicit.
      - id: AP-06
        name: human_to_agent_delegation
        description: Human-to-Agent Delegation.
        shape: |
          Human / Role -> Entrusted Intent -> Bounded Authority ->
          Agentic Participation.
        note: |
          Delegation is not equivalent to issuing a task
          instruction.
      - id: AP-07
        name: distributed_agentic_participation
        description: Distributed Agentic Participation.
        shape: |
          Value Stream
            |
          +-+-----+--+
          v         v
          Agent A  Agent B
        requirement: |
          Each participation point must retain: intent; authority;
          context; action selection; outcome contribution.
      - id: AP-08
        name: coordinated_multi_agent_realization
        description: Coordinated Multi-Agent Realization.
        coordination_modes:
          - task_allocation
          - negotiation
          - information_exchange
          - shared_state
          - escalation
          - synchronization
        note: |
          Multi-agent architecture is optional. It is not a semantic
          requirement for AVS.
      - id: AP-09
        name: agentic_orchestration
        description: Agentic Orchestration.
        shape: |
          Intent -> Orchestrator -> Agent A / Agent B / Human ->
          Outcome.
        warning: |
          The orchestrator itself does NOT automatically qualify as
          Agentic. Its participation must satisfy the AVS
          qualification rules.
      - id: AP-10
        name: agentic_exception_resolution
        description: Agentic Exception Resolution.
        shape: |
          Normal Flow -> Exception -> Contextual Interpretation
          -> Agentic Selection -> Resolution -> Resume Value
          Stream.
        importance: |
          Especially important because agenticity need not dominate
          the entire Value Stream.
      - id: AP-11
        name: agentic_coordination_overlay
        description: Agentic Coordination Overlay.
        shape: |
          Stage A ----Stage D
                 \\   //
            Agentic Overlay
        note: |
          The overlay is an architectural realization pattern. It
          is NOT a new semantic entity such as "Agentic Workflow."
      - id: AP-12
        name: progressive_delegation
        description: Progressive Delegation.
        shape: |
          Advisory -> Delegated Selection -> Bounded Execution ->
          Expanded Delegation.
        requirement: |
          Progression must be governed by evidence and authority
          policy. It must NOT be interpreted as mandatory maturity
          progression.

  # ----------------------------------------------------------------
  # 8. Architecture boundary model
  # ----------------------------------------------------------------
  boundary_model:
    description: |
      Every AVS architecture SHOULD identify four boundaries.
    items:
      - id: value_boundary
        name: Value Boundary
        description: Where Value Stream realization begins and ends.
      - id: agentic_boundary
        name: Agentic Boundary
        description: |
          Where delegated agentic participation occurs.
      - id: authority_boundary
        name: Authority Boundary
        description: |
          What the agent may and may not decide or execute.
      - id: technology_boundary
        name: Technology Boundary
        description: |
          Which systems and infrastructure implement the
          realization.
    diagram: |
      +-----------------------------------+
      |        VALUE BOUNDARY             |
      |                                   |
      |  +-----------------------------+  |
      |  |     AGENTIC BOUNDARY        |  |
      |  |                             |  |
      |  |  Intent -> Context -> Sel.  |  |
      |  |           v                 |  |
      |  |   AUTHORITY BOUNDARY         |  |
      |  |           v                 |  |
      |  |         Action              |  |
      |  +-----------------------------+  |
      |                                   |
      |     TECHNOLOGY BOUNDARY           |
      +-----------------------------------+

  # ----------------------------------------------------------------
  # 9. Architecture decision record model
  # ----------------------------------------------------------------
  decision_record:
    description: |
      Every material architecture should document an architecture
      decision record.
    template: |
      architecture_decision:
        id:
        value_stream:
        agentic_participation:
        pattern:
        rationale:
        authority:
        context:
        action_space:
        human_interaction:
        fallback:
        risks:
        measures:
        governance:

  # ----------------------------------------------------------------
  # 10. Architecture quality attributes (12)
  # ----------------------------------------------------------------
  quality_attributes:
    items:
      - value_effectiveness
      - semantic_integrity
      - authority_integrity
      - safety
      - explainability
      - observability
      - resilience
      - reversibility
      - intervention
      - scalability
      - interoperability
      - maintainability
      - auditability

  # ----------------------------------------------------------------
  # 11. Architecture reference selection
  # ----------------------------------------------------------------
  selection:
    select_according_to:
      - value_stream_structure
      - decision_materiality
      - authority
      - risk
      - contextual_complexity
      - intervention_requirements
      - reversibility
      - outcome_criticality
      - integration_complexity
    do_not_select_according_to:
      - novelty
      - agent_count
      - model_size
      - autonomy_preference

  # ----------------------------------------------------------------
  # 12. Architecture anti-patterns (6)
  # ----------------------------------------------------------------
  anti_patterns:
    description: |
      The following SHALL be rejected as architecture anti-patterns.
    items:
      - id: AP-A01
        name: agent_centric_architecture
        claim: |
          Starting with agents and attempting to discover the Value
          Stream afterward.
        rejected_because: |
          Architecture realizes AVS semantics; it does not define
          them. The primary architectural object is the Value
          Stream.
      - id: AP-A02
        name: agentic_workflow_ontology
        claim: |
          Creating a parallel workflow hierarchy merely because
          agents participate.
        rejected_because: |
          Agentic coordination may overlay multiple Value Stages
          without creating a new Value Stream hierarchy
          (AP-11). "Agentic Workflow" is NOT a new semantic entity.
      - id: AP-A03
        name: full_agentification_assumption
        claim: |
          Assuming every Value Stage must become agentic.
        rejected_because: |
          A Value Stream can be heterogeneous (human, automation,
          agentic participation in different stages).
      - id: AP-A04
        name: autonomy_maximization
        claim: |
          Treating maximum autonomy as the target architecture.
        rejected_because: |
          Autonomy is NOT a semantic requirement for AVS. The
          objective is appropriate delegated value realization
          within authority boundaries, not maximum delegation.
      - id: AP-A05
        name: technology_led_semantics
        claim: |
          Defining AVS based on the architecture of a particular
          agent platform.
        rejected_because: |
          The implementation layer may change without changing AVS
          semantics. Technology MUST NOT define AVS qualification.
      - id: AP-A06
        name: orchestration_equals_agenticity
        claim: |
          Assuming an orchestrator is automatically an agentic
          participant.
        rejected_because: |
          An orchestrator's participation must satisfy AVS
          qualification rules independently.

  # ----------------------------------------------------------------
  # 13. Technology-neutrality principle
  # ----------------------------------------------------------------
  technology_neutrality:
    principle: |
      The implementation technology is an implementation concern,
      not a qualification criterion. An AVS may be implemented
      using: one agent; multiple agents; an AI model; no AI model;
      deterministic software; workflow; automation; human-agent
      combinations; conventional applications; combinations.
    substitution_principle: |
      If both implementations preserve intent, authority, context,
      selection, action, outcome, and governance, then platform
      substitution SHALL NOT inherently change AVS identity.

  # ----------------------------------------------------------------
  # 14. Invariants (6)
  # ----------------------------------------------------------------
  invariants:
    description: |
      CR-VAS-008 introduces the following invariants.
    items:
      - id: AVS-ARCH-INV-001
        statement: |
          Architecture realizes AVS semantics; it does NOT define
          them.
      - id: AVS-ARCH-INV-002
        statement: |
          Technology MUST NOT define AVS qualification.
      - id: AVS-ARCH-INV-003
        statement: |
          Agent framework choice MUST NOT define agenticity.
      - id: AVS-ARCH-INV-004
        statement: |
          Orchestrator presence MUST NOT establish agentic
          qualification.
      - id: AVS-ARCH-INV-005
        statement: |
          Multi-agent architecture is OPTIONAL, not a semantic
          requirement.
      - id: AVS-ARCH-INV-006
        statement: |
          Heterogeneous Value Streams (human + automation + agent)
          are a first-class AVS architecture pattern.

  # ----------------------------------------------------------------
  # 15. Boundary assertions
  # ----------------------------------------------------------------
  boundary_assertions:
    per_cr_vas_008_architecture_patterns: |
      Per CR-VAS-008, architecture realizes AVS semantics; it does
      NOT define them. Six architectural planes (P1..P6) keep
      technology at the bottom of the semantic dependency chain.
      Technology substitution SHALL NOT inherently change AVS
      identity as long as intent, authority, context, selection,
      action, outcome, and governance are preserved.

