description: |
  Automation present but no Agentic Participation. Automation alone is non-conformant per CR-VAS-003 §16.

  This is boundary test VAS-BT-02 of 10 for Agentic Value Stream.
  Per CR-VAS-003 §24, boundary tests establish the distinction
  between Agentic Participation and adjacent concepts
  (automation, AI, workflow, autonomy, deterministic behavior,
  human discretion, hybrid, multi-agent, non-AI).

