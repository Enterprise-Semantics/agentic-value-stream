qualification_label: Agent present but deterministic behavior
summary: Agent present but deterministic behavior
description: |
  An Agent labelled entity that follows a completely predetermined sequence (no contextual interpretation, no selection) is non-conformant.

  This is boundary test VAS-BT-04 of 10 for Agentic Value Stream.
  Per CR-VAS-003 §24, boundary tests establish the distinction
  between Agentic Participation and adjacent concepts
  (automation, AI, workflow, autonomy, deterministic behavior,
  human discretion, hybrid, multi-agent, non-AI).

