category: maturity_ma-boundary
subject: Maturity vs Technology Maturity Model
description: 'CR-VAS-006 §3.2: AVS maturity is NOT Rules -> ML -> GenAI -> Agents -> Multi-Agent -> Autonomous AI. Technology
  progression SHALL NOT define agentic maturity.'
cr: CR-VAS-006 §boundary
expect: architecture separation between technology progression and maturity; capability_dimensions cover C2 governance + C4
