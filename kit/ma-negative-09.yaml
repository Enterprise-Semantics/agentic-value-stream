id: KIT-AGENTIC-VALUE-STREAM-VAS-MA-N09
test_id: VAS-MA-N09
category: maturity_ma-negative
subject: Maturity Shall Not Be Used As Semantic Qualification Evidence
description: 'CR-VAS-006 §3.1: Level 3 maturity, AI adoption, agent count, automation degree, autonomy percentage, model sophistication,
  absence of human intervention, and operational scale SHALL NOT be used as evidence that a Value Stream is Agentic.'
cr: CR-VAS-006 §boundary
expect: separation.vs_qualification explicitly forbids maturity-as-qualification; invariants AVS-MAT-INV-001 present.
asserts:
- maturity.separation.vs_qualification is defined
- maturity.invariants.items contains item with id == AVS-MAT-INV-001
- maturity.invariants.items[id=AVS-MAT-INV-001].statement contains does not define
