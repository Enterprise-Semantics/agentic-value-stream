id: KIT-AGENTIC-VALUE-STREAM-VAS-MA-P09
test_id: VAS-MA-P09
category: maturity_ma-positive
subject: Human Participation Guarantee
description: Human participation SHALL remain a first-class design option at every maturity level; mandatory human approvals
  for high-risk decisions SHALL NOT incur a maturity penalty.
cr: CR-VAS-006 §boundary
expect: human_participation.principle and human_participation.invariant both defined; interaction_patterns includes at least
  one human-in-loop pattern.
asserts:
- maturity.human_participation.principle is defined
- maturity.human_participation.invariant is defined
- maturity.human_participation.interaction_patterns contains agent_to_human_approval_to_action
- maturity.human_participation.interaction_patterns contains human_decision_to_agent_execution
