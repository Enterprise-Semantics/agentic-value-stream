versioning_alignment:
  rationale: Per CR-VAS-010, the AVS versioning block aligns with the OpenDEA reference architecture versioning model. OpenDEA
    requires machine-readable release manifests and explicit migration metadata; CR-VAS-010 adopts both and adds normative
    invariants SV-INV-001..008 that bind change classification, SemVer policy, and migration transparency.
  versioning_block_anchors:
  - versioning.change_classification (9-class taxonomy incl. Multi)
  - versioning.canonical_authority (artifact record schema)
  - versioning.invariant_evolution (stable ID + introduced_in + verification)
  - versioning.controlled_vocabulary_evolution (add/deprecate/rename/remove)
  - versioning.deprecation_lifecycle (Active -> Deprecated -> Retired)
  - versioning.dual_version_support (cross-version conformance rules)
  - versioning.impact_analysis (dependency graph chain)
  - versioning.invariants (SV-INV-001..008)
  opendea_correspondence:
  - avs: versioning.change_classification
    opendea: OpenDEA Change Management §3 (9-class taxonomy)
    relation: concretises
  - avs: versioning.canonical_authority
    opendea: OpenDEA Reference Architecture §4 (canonical source of truth)
    relation: concretises
  - avs: versioning.invariant_evolution
    opendea: OpenDEA Reference Architecture §5 (invariant lifecycle)
    relation: concretises
  - avs: versioning.controlled_vocabulary_evolution
    opendea: OpenDEA Reference Architecture §6 (vocabulary governance)
    relation: concretises
  - avs: versioning.deprecation_lifecycle
    opendea: OpenDEA Reference Architecture §7 (deprecation)
    relation: concretises
  - avs: versioning.dual_version_support
    opendea: OpenDEA Reference Architecture §8 (dual-version support)
    relation: concretises
  - avs: versioning.impact_analysis
    opendea: OpenDEA Reference Architecture §9 (dependency analysis)
    relation: concretises
  - avs: versioning.invariants
    opendea: OpenDEA Reference Architecture §10 (normative invariants)
    relation: concretises
  compatibility_evidence:
    semantic: compatible (additive block; preserves prior qualification, evidence, measurement, maturity, governance, architecture,
      interoperability contracts)
    schema: compatible (no schema changes; new block is additive to concept.yaml)
    conformance: compatible (no existing test changes; 18 new sv-* tests added)
    instance: compatible (no instance-shape changes)
    mapping: compatible (wsf_mapping and opendea_mapping receive new versioning_alignment blocks)
  invariants_anchored:
  - SV-INV-004 (invariant ID stability across releases)
  - SV-INV-005 (migration transformations MUST be explicit; no silent inference)
  - SV-INV-007 (cross-version auto-labelling forbidden)
  - SV-INV-008 (schema-compat does not equal semantic-compat)
