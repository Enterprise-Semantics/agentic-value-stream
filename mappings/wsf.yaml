versioning_alignment:
  rationale: Per CR-VAS-010, the AVS versioning block aligns with the WSF SemVer and release manifest model. WSF treats SemVer
    as a release convention that does not itself establish semantic compatibility; CR-VAS-010 adopts the same view and adds
    an explicit five-dimension compatibility assessment plus migration classes M0..M4.
  versioning_block_anchors:
  - versioning.versioning_policy (SemVer MAJOR.MINOR.PATCH + warning)
  - versioning.version_distinction (specification vs artifact)
  - versioning.compatibility_dimensions (Definition, Instance, Schema, Conformance, Mapping)
  - versioning.migration_classes (M0..M4)
  - versioning.release_manifest (machine-readable manifest template)
  wsf_correspondence:
  - avs: versioning.principle
    wsf: WSF SemVer §2 (release convention)
    relation: concretises
  - avs: versioning.versioning_policy.major
    wsf: WSF SemVer §3.1 (incompatible changes)
    relation: concretises
  - avs: versioning.versioning_policy.minor
    wsf: WSF SemVer §3.2 (compatible additions)
    relation: concretises
  - avs: versioning.versioning_policy.patch
    wsf: WSF SemVer §3.3 (corrections)
    relation: concretises
  - avs: versioning.version_distinction
    wsf: WSF SemVer §4 (spec vs artifact)
    relation: concretises
  - avs: versioning.compatibility_dimensions
    wsf: WSF Release Manifest §2 (compatibility report)
    relation: extends
  - avs: versioning.migration_classes
    wsf: WSF Migration Records §3 (M0..M4)
    relation: concretises
  - avs: versioning.release_manifest
    wsf: WSF Release Manifest §1 (machine-readable manifest)
    relation: concretises
  - avs: versioning.change_request_requirements
    wsf: WSF Change Request §1 (14-item checklist)
    relation: concretises
  compatibility_evidence:
    semantic: compatible (additive block; preserves prior qualification, evidence, measurement, maturity, governance, architecture,
      interoperability contracts)
    schema: compatible (no schema changes; new block is additive to concept.yaml)
    conformance: compatible (no existing test changes; 18 new sv-* tests added)
    instance: compatible (no instance-shape changes)
    mapping: compatible (wsf_mapping and opendea_mapping receive new versioning_alignment blocks)
  invariants_anchored:
  - SV-INV-001 (classification by impact, not diff size)
  - SV-INV-002 (SemVer is a release convention, not compatibility)
  - SV-INV-003 (qualification change MUST NOT be a patch)
  - SV-INV-006 (no cross-repo canonical conflict without reconciliation)
